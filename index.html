function DoctorView({user,patients,setPatients,labOrders,setLabOrders,confidentialNotes,setConfidentialNotes,prescriptions,setPrescriptions,payments,notifications,setNotifications,addNotification,files,setFiles,toast}){
  const [tab,setTab]=useState('queue');
  const [dossier,setDossier]=useState(null);
  const [editP,setEditP]=useState(null);
  const [showNotifs,setShowNotifs]=useState(false);
  const activeQueue=patients.filter(p=>p.step===3);
  const myOngoing=patients.filter(p=>p.doctorId===user.id&&p.step!==3&&p.step<7);
  const myDone=patients.filter(p=>p.doctorId===user.id&&p.step===7);
  const myNotifs=notifications.filter(n=>n.forDoctorId===user.id);
  const unread=myNotifs.filter(n=>!n.read).length;

  const markAllRead=async()=>{
    for(const n of myNotifs.filter(n=>!n.read)){try{await supabase.from('notifications').update({read:true}).eq('id',n.id);}catch(e){}}
    setNotifications(prev=>prev.map(n=>n.forDoctorId===user.id?{...n,read:true}:n));
  };

  const tabs=[
    {id:'queue',icon:'fas fa-stethoscope',label:'Consultations',count:activeQueue.length},
    {id:'mypatients',icon:'fas fa-user-doctor',label:'Mes Patients',count:myOngoing.length},
    {id:'hosp',icon:'fas fa-bed',label:'Hospitalisés'},
    {id:'notes',icon:'fas fa-lock',label:'Notes Conf.'},
  ];

  const hospPatients=patients.filter(p=>p.doctorId===user.id&&p.hospitalization?.status==='active');

  return <DashLayout user={user} tabs={tabs} activeTab={tab} setActiveTab={setTab} topRight={
    <div style={{position:'relative'}}>
      <button onClick={()=>setShowNotifs(!showNotifs)} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',borderRadius:'var(--r-md)',border:'1px solid var(--border-subtle)',background:'var(--surface)',cursor:'pointer',fontWeight:600,fontSize:'12px'}}>
        <i className="fas fa-bell" style={{color:'var(--primary-600)'}}></i> Alertes {unread>0&&<span style={{background:'var(--danger-500)',color:'#fff',fontSize:'9px',fontWeight:700,padding:'1px 5px',borderRadius:20}}>{unread}</span>}
      </button>
      {showNotifs&&<div style={{position:'absolute',top:'calc(100% + 8px)',right:0,width:380,maxHeight:480,background:'var(--surface)',borderRadius:'var(--r-lg)',boxShadow:'var(--e-4)',z:1100,overflow:'hidden',border:'1px solid var(--border-subtle)',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border-subtle)',display:'flex',justifyContent:'space-between',alignItems:'center',fontWeight:700}}>
          <span>Alertes</span>
          {unread>0&&<button className="btn btn-sm btn-outline" onClick={markAllRead} style={{fontSize:'10px'}}><i className="fas fa-check-double"></i> Lu</button>}
        </div>
        <div style={{maxHeight:400,overflowY:'auto',background:'var(--ink-25)'}}>
          {!myNotifs.length&&<div className="empty-state" style={{padding:'30px 20px'}}><div className="empty-state-icon"><i className="fas fa-bell-slash"></i></div><div className="empty-state-title">Tout est calme</div></div>}
          {myNotifs.slice(0,20).map(n=>{
            const mins=Math.round((Date.now()-new Date(n.createdAt))/60000);
            const ago=mins<1?'à l\'instant':mins<60?`${mins} min`:mins<1440?`${Math.round(mins/60)} h`:`${Math.round(mins/1440)} j`;
            return <div key={n.id} style={{padding:'12px 18px',borderBottom:'1px solid var(--border-subtle)',background:n.read?'var(--surface)':'var(--primary-50)',borderLeft:n.read?'none':'3px solid var(--accent)',cursor:'pointer'}}>
              <div style={{fontWeight:600}}>{n.patientName}</div>
              <div style={{fontSize:'12px',color:'var(--text-light)',marginTop:2}}>{n.message}</div>
              <div style={{fontSize:'10px',color:'var(--text-muted)',marginTop:4}}>il y a {ago} · {n.fromUser}</div>
            </div>;
          })}
        </div>
      </div>}
    </div>
  }>
    {tab==='queue'&&<div>
      <div className="page-header"><div><h1>Consultations</h1><p>{activeQueue.length} patient(s) à voir</p></div></div>
      {!activeQueue.length&&<div className="card" style={{textAlign:'center',padding:30}}><p style={{color:'var(--text-light)',fontSize:'16px'}}>Aucun patient en attente</p></div>}
      {activeQueue.map(p=><DoctorConsultCard key={p.id} patient={p} user={user} patients={patients} setPatients={setPatients} labOrders={labOrders} setLabOrders={setLabOrders} confidentialNotes={confidentialNotes} setConfidentialNotes={setConfidentialNotes} prescriptions={prescriptions} setPrescriptions={setPrescriptions} payments={payments} addNotification={addNotification} files={files} setFiles={setFiles} onDossier={setDossier} onEdit={setEditP} toast={toast}/>)}
    </div>}

    {tab==='mypatients'&&<div>
      <div className="page-header"><div><h1>Mes Patients</h1></div></div>
      {!myOngoing.length&&!myDone.length&&<div className="card" style={{textAlign:'center',padding:30}}><p style={{color:'var(--text-light)'}}>Aucun patient assigné</p></div>}
      {myOngoing.map(p=><div key={p.id} className="card" style={{borderLeft:'4px solid var(--gold)'}}>
        <div className="card-header">
          <div style={{display:'flex',gap:10,alignItems:'center'}}><PatientAvatar patient={p}/><div><div style={{fontWeight:700}}>{p.nom} {p.prenom}</div><div className="patient-flow" style={{marginTop:6}}>{STEPS.map((s,i)=><span key={i} className={`flow-step ${i<p.step?'done':''} ${i===p.step?'current':''}`}>{s}</span>)}</div></div></div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}><InsuranceBadge type={p.insurance}/><span className="badge badge-blue">{p.stepLabel}</span><button className="btn btn-sm btn-primary" onClick={()=>setDossier(p)}><i className="fas fa-folder-open"></i></button></div>
        </div>
        {p.diagnosis&&<div style={{fontSize:'12px',marginTop:4,color:'var(--text)'}}><strong>Diagnostic:</strong> {p.diagnosis}</div>}
        <PatientActivityFeed patientId={p.id} payments={payments} labOrders={labOrders} prescriptions={prescriptions} files={files} limit={3}/>
      </div>)}
      {myDone.length>0&&<><h3 style={{margin:'24px 0 12px',color:'var(--text-light)'}}>Patients terminés</h3>
      <div className="card"><table><thead><tr><th>Patient</th><th>Diagnostic</th><th>Assurance</th><th></th></tr></thead><tbody>
      {myDone.map(p=><tr key={p.id}><td><strong>{p.nom} {p.prenom}</strong></td><td>{p.diagnosis||'—'}</td><td><InsuranceBadge type={p.insurance} size="badge-sm"/></td><td><button className="btn btn-sm btn-outline" onClick={()=>setDossier(p)}><i className="fas fa-folder-open"></i></button></td></tr>)}
      </tbody></table></div></>}
    </div>}

    {tab==='hosp'&&<div>
      <div className="page-header"><div><h1>Mes Patients Hospitalisés</h1></div></div>
      {!hospPatients.length&&<div className="card"><div className="empty-state"><div className="empty-state-icon"><i className="fas fa-bed"></i></div><div className="empty-state-title">Aucun patient hospitalisé</div></div></div>}
      {hospPatients.map(p=><DoctorHospCard key={p.id} patient={p} user={user} patients={patients} setPatients={setPatients} labOrders={labOrders} setLabOrders={setLabOrders} prescriptions={prescriptions} setPrescriptions={setPrescriptions} addNotification={addNotification} onDossier={setDossier} toast={toast}/>)}
    </div>}

    {tab==='notes'&&<div>
      <div className="page-header"><div><h1>Notes Confidentielles</h1></div></div>
      {!confidentialNotes.filter(n=>n.doctorId===user.id||user.isSuperAdmin).length&&<div className="card"><p style={{textAlign:'center',padding:20,color:'var(--text-light)'}}>Aucune note</p></div>}
      {confidentialNotes.filter(n=>n.doctorId===user.id||user.isSuperAdmin).map(n=><div key={n.id} className="confidential-note">
        <div style={{display:'flex',justifyContent:'space-between'}}><strong>{n.patientName}</strong><span style={{fontSize:'11px',color:'var(--text-light)'}}>{new Date(n.date).toLocaleString('fr-FR')}</span></div>
        <p style={{marginTop:8,fontSize:'13px'}}>{n.content}</p>
      </div>)}
    </div>}

    {dossier&&<PatientDossier patient={dossier} payments={payments} labOrders={labOrders} prescriptions={prescriptions} confidentialNotes={confidentialNotes} files={files} user={user} patients={patients} setPatients={setPatients} onClose={()=>setDossier(null)}/>}
    {editP&&<EditPatientModal patient={editP} patients={patients} setPatients={setPatients} onClose={()=>setEditP(null)}/>}
  </DashLayout>;
}

/* ===== DOCTOR CONSULT CARD ===== */
function DoctorConsultCard({patient,user,patients,setPatients,labOrders,setLabOrders,confidentialNotes,setConfidentialNotes,prescriptions,setPrescriptions,payments,addNotification,files,setFiles,onDossier,onEdit,toast}){
  const [insurance,setInsurance]=useState(patient.insurance);
  const [diagnosis,setDiagnosis]=useState(patient.diagnosis||'');
  const [note,setNote]=useState('');
  const [labDesc,setLabDesc]=useState('');
  const [rxText,setRxText]=useState('');
  const pLabs=labOrders.filter(l=>l.patientId===patient.id&&l.status==='completed');
  const pRx=prescriptions.filter(r=>r.patientId===patient.id);
  const pPay=(payments||[]).filter(p=>p.patientId===patient.id);

  const assignIns=async()=>{
    try{await supabase.from('patients').update({insurance}).eq('id',patient.id);setPatients(patients.map(p=>p.id===patient.id?{...p,insurance}:p));toast.success('Assurance mise à jour: '+insurance);}catch(e){toast.error('Erreur assurance');}
  };
  const addNote=async()=>{
    if(!note.trim()){toast.warning('Note vide.');return;}
    try{
      const n={id:'N'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,doctorId:user.id,doctorName:user.name,content:note,date:new Date().toISOString()};
      const {error}=await supabase.from('confidential_notes').insert({id:n.id,patient_id:patient.id,patient_name:n.patientName,doctor_id:user.id,doctor_name:user.name,content:note,date:n.date});
      if(error)throw error;
      setConfidentialNotes([...confidentialNotes,n]);setNote('');toast.success('Note enregistrée');
    }catch(e){toast.error('Erreur note');}
  };
  const orderLab=async()=>{
    if(!labDesc.trim()){toast.warning('Décrivez les examens.');return;}
    try{
      const o={id:'LAB'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,description:labDesc,orderedBy:user.name,date:new Date().toISOString(),status:'pending',results:null};
      const {error}=await supabase.from('lab_orders').insert({id:o.id,patient_id:patient.id,patient_name:o.patientName,description:labDesc,ordered_by:user.name,date:o.date,status:'pending'});
      if(error)throw error;
      setLabOrders([...labOrders,o]);setLabDesc('');toast.success('Ordre labo ajouté');
    }catch(e){toast.error('Erreur labo');}
  };
  const addRx=async()=>{
    if(!rxText.trim()){toast.warning('Entrez la prescription.');return;}
    try{
      const r={id:'RX'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,content:rxText,prescribedBy:user.name,date:new Date().toISOString(),dispensed:false};
      const {error}=await supabase.from('prescriptions').insert({id:r.id,patient_id:patient.id,patient_name:r.patientName,content:rxText,prescribed_by:user.name,date:r.date,dispensed:false});
      if(error)throw error;
      setPrescriptions([...prescriptions,r]);setRxText('');toast.success('Prescription ajoutée');
    }catch(e){toast.error('Erreur prescription');}
  };
  const sendTo=async(step,label,sendBackToPharm=false)=>{
    try{
      await supabase.from('patients').update({step,step_label:label,diagnosis,doctor_id:user.id,doctor_name:user.name}).eq('id',patient.id);
      setPatients(patients.map(p=>p.id===patient.id?{...p,step,stepLabel:label,diagnosis,doctorId:user.id,doctorName:user.name}:p));
      toast.success(`Patient → ${label}`);
    }catch(e){toast.error('Erreur: '+(e.message||''));}
  };
  const discharge=async()=>{
    if(!confirm('Confirmer la sortie du patient?'))return;
    await sendTo(6,'Pharmacie (Sortie)');
  };

  return <div className="card" style={{borderLeft:'3px solid var(--accent)'}}>
    <div className="card-header">
      <div style={{display:'flex',alignItems:'center',gap:12,flex:1,flexWrap:'wrap'}}>
        <PatientAvatar patient={patient}/>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:'15px'}}>{patient.nom} {patient.prenom}</div>
          <div style={{fontSize:'12px',color:'var(--text-muted)',marginTop:2}}>{patient.sexe==='M'?'M':'F'} · {patient.id} · {patient.phone}</div>
          <div className="patient-flow" style={{marginTop:8}}>{STEPS.map((s,i)=><span key={i} className={`flow-step ${i<patient.step?'done':''} ${i===patient.step?'current':''}`}>{s}</span>)}</div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <button className="btn btn-sm btn-outline" onClick={()=>onDossier(patient)}><i className="fas fa-folder-open"></i> Dossier</button>
        <button className="btn btn-sm btn-outline" onClick={()=>onEdit(patient)}><i className="fas fa-pen"></i></button>
        <InsuranceBadge type={patient.insurance}/>
      </div>
    </div>

    {patient.vitals&&<div style={{background:'#f0f7f4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:'12px'}}>
      <strong>Vitaux:</strong> T° {patient.vitals.temp}°C | TA: {patient.vitals.tension} | Poids: {patient.vitals.poids}kg | Pouls: {patient.vitals.pouls}bpm | SpO₂: {patient.vitals.spo2}% | <span className={`badge badge-sm ${patient.vitals.triage?.includes('Rouge')?'badge-red':patient.vitals.triage?.includes('Orange')?'badge-yellow':'badge-green'}`}>{patient.vitals.triage}</span>
    </div>}

    {pLabs.length>0&&<div style={{background:'#e0f2fe',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:'12px'}}>
      <strong><i className="fas fa-flask"></i> Résultats Labo:</strong>
      {pLabs.map(l=><div key={l.id} style={{marginTop:4,padding:'4px 8px',background:'#fff',borderRadius:4}}><strong>{l.description}:</strong> {l.results}</div>)}
    </div>}

    {pRx.length>0&&<div style={{background:'#fffbf5',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:'12px'}}>
      <strong><i className="fas fa-pills"></i> Prescriptions:</strong>
      {pRx.map(r=><div key={r.id} style={{marginTop:3}}>{r.content} <span className={`badge badge-sm ${r.dispensed?'badge-green':'badge-yellow'}`}>{r.dispensed?'Dispensé':'Attente'}</span></div>)}
    </div>}

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
      <div>
        <div className="form-group"><label>Diagnostic</label><input value={diagnosis} onChange={e=>setDiagnosis(e.target.value)} placeholder="Diagnostic principal..."/></div>
        <div className="form-group"><label>Catégorie Assurance</label>
          <div style={{display:'flex',gap:8}}>
            <select value={insurance} onChange={e=>setInsurance(e.target.value)} style={{flex:1}}>
              {INSURANCE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <button className="btn btn-sm btn-gold" onClick={assignIns}><i className="fas fa-check"></i></button>
          </div>
          <div style={{fontSize:'10.5px',color:'var(--text-muted)',marginTop:3}}>{INSURANCE_INFO[insurance]?.desc}</div>
        </div>
      </div>
      <div>
        <div className="form-group"><label><i className="fas fa-flask"></i> Ordres Labo</label>
          <div style={{display:'flex',gap:8}}><input value={labDesc} onChange={e=>setLabDesc(e.target.value)} placeholder="NFS, GE, CRP..."/><button className="btn btn-sm btn-primary" onClick={orderLab}><i className="fas fa-plus"></i></button></div>
        </div>
        <div className="form-group"><label><i className="fas fa-pills"></i> Prescription</label>
          <div style={{display:'flex',gap:8}}><input value={rxText} onChange={e=>setRxText(e.target.value)} placeholder="Médicaments + posologie"/><button className="btn btn-sm btn-success" onClick={addRx}><i className="fas fa-plus"></i></button></div>
        </div>
      </div>
    </div>

    {/* File upload for doctor */}
    <div style={{marginBottom:14}}>
      <div style={{fontSize:'11px',fontWeight:700,color:'var(--ink-500)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>Documents / Images / PDF</div>
      <FileUpload patientId={patient.id} patientName={`${patient.nom} ${patient.prenom}`} uploadedBy={user.name} onUploaded={f=>setFiles(prev=>[f,...prev])} toast={toast}/>
      {files.filter(f=>f.patientId===patient.id).length>0&&<div style={{marginTop:8}}><FileList files={files} patientId={patient.id} canDelete={true} onDelete={async id=>{try{await supabase.from('patient_files').delete().eq('id',id);setFiles(prev=>prev.filter(f=>f.id!==id));toast.success('Fichier supprimé');}catch(e){toast.error('Erreur suppression');}}}/></div>}
    </div>

    <div className="form-group"><label><i className="fas fa-lock"></i> Note Confidentielle</label>
      <div style={{display:'flex',gap:8}}><textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Note privée médecin..." style={{minHeight:60,flex:1}}/><button className="btn btn-sm btn-warning" onClick={addNote} style={{alignSelf:'flex-end'}}><i className="fas fa-lock"></i> Sauver</button></div>
    </div>

    {pPay.length>0&&<div style={{fontSize:'12px',color:'var(--text-light)',marginBottom:10}}><i className="fas fa-receipt"></i> {pPay.length} paiement(s) — Total: {fmt(pPay.reduce((s,p)=>s+p.amount,0))}</div>}

    <div style={{display:'flex',gap:10,marginTop:16,paddingTop:16,borderTop:'1px solid var(--border)',flexWrap:'wrap'}}>
      <button className="btn btn-primary" onClick={()=>sendTo(4,'Pharmacie (Examens/Méds)')}><i className="fas fa-flask"></i> → Pharmacie (Labo/Méds)</button>
      <button className="btn btn-info" onClick={()=>sendTo(1,'Pharmacie (Pré-Labo)')}><i className="fas fa-pills"></i> → Pharmacie (avant Labo)</button>
      <button className="btn btn-success" onClick={discharge}><i className="fas fa-door-open"></i> Sortie → Pharmacie</button>
    </div>
  </div>;
}

/* ===== DOCTOR HOSPITALIZED PATIENT CARD ===== */
function DoctorHospCard({patient,user,patients,setPatients,labOrders,setLabOrders,prescriptions,setPrescriptions,addNotification,onDossier,toast}){
  const [labDesc,setLabDesc]=useState('');
  const [rxText,setRxText]=useState('');
  const acts=patient.hospitalization?.acts||[];
  const totalActs=acts.reduce((s,a)=>s+a.price,0);

  const orderLab=async()=>{
    if(!labDesc.trim()){toast.warning('Décrivez les examens.');return;}
    try{
      const o={id:'LAB'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,description:labDesc,orderedBy:user.name,date:new Date().toISOString(),status:'pending',results:null,forHosp:true};
      const {error}=await supabase.from('lab_orders').insert({id:o.id,patient_id:patient.id,patient_name:o.patientName,description:labDesc,ordered_by:user.name,date:o.date,status:'pending'});
      if(error)throw error;
      setLabOrders([...labOrders,o]);setLabDesc('');toast.success('Labo demandé pour hospitalisé');
    }catch(e){toast.error('Erreur');}
  };
  const addRx=async()=>{
    if(!rxText.trim()){toast.warning('Entrez la prescription.');return;}
    try{
      const r={id:'RX'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,content:rxText,prescribedBy:user.name,date:new Date().toISOString(),dispensed:false,forHosp:true};
      const {error}=await supabase.from('prescriptions').insert({id:r.id,patient_id:patient.id,patient_name:r.patientName,content:rxText,prescribed_by:user.name,date:r.date,dispensed:false});
      if(error)throw error;
      setPrescriptions([...prescriptions,r]);setRxText('');toast.success('Prescription ajoutée');
    }catch(e){toast.error('Erreur');}
  };
  const discharge=async()=>{
    if(!confirm(`Décharger ${patient.nom} ${patient.prenom}? Un paiement final sera généré en pharmacie.`))return;
    try{
      const updHosp={...patient.hospitalization,status:'discharged',dischargedAt:new Date().toISOString(),dischargedBy:user.name};
      await supabase.from('patients').update({step:6,step_label:'Pharmacie (Sortie Hospit.)',hospitalization:updHosp}).eq('id',patient.id);
      setPatients(patients.map(p=>p.id===patient.id?{...p,step:6,stepLabel:'Pharmacie (Sortie Hospit.)',hospitalization:updHosp}:p));
      toast.success('Patient dirigé vers pharmacie pour paiement final');
    }catch(e){toast.error('Erreur décharge: '+(e.message||''));}
  };

  return <div className="hosp-card" style={{marginBottom:14,padding:'16px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
      <div style={{display:'flex',gap:12,alignItems:'center'}}><PatientAvatar patient={patient}/><div>
        <div style={{fontWeight:700,fontSize:'14px'}}>{patient.nom} {patient.prenom}</div>
        <div style={{fontSize:'12px',color:'#0369a1',marginTop:2}}><i className="fas fa-bed"></i> Chambre {patient.hospitalization.room} · {patient.phone}</div>
        <div style={{marginTop:6,display:'flex',gap:6}}><InsuranceBadge type={patient.insurance} size="badge-sm"/><span style={{fontSize:'11px',color:'var(--text-muted)'}}>{acts.length} actes infirmiers · {fmt(totalActs)}</span></div>
      </div></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-sm btn-primary" onClick={()=>onDossier(patient)}><i className="fas fa-folder-open"></i> Dossier</button>
        <button className="btn btn-sm btn-danger" onClick={discharge}><i className="fas fa-sign-out-alt"></i> Décharger</button>
      </div>
    </div>
    <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <div className="form-group" style={{marginBottom:0}}><label><i className="fas fa-flask"></i> Demande Labo (hospit.)</label>
        <div style={{display:'flex',gap:8}}><input value={labDesc} onChange={e=>setLabDesc(e.target.value)} placeholder="NFS, Glycémie..."/><button className="btn btn-sm btn-primary" onClick={orderLab}><i className="fas fa-plus"></i></button></div>
      </div>
      <div className="form-group" style={{marginBottom:0}}><label><i className="fas fa-pills"></i> Prescription (hospit.)</label>
        <div style={{display:'flex',gap:8}}><input value={rxText} onChange={e=>setRxText(e.target.value)} placeholder="Médicaments..."/><button className="btn btn-sm btn-success" onClick={addRx}><i className="fas fa-plus"></i></button></div>
      </div>
    </div>
    {acts.length>0&&<div style={{marginTop:10,background:'rgba(255,255,255,.6)',borderRadius:'var(--r-sm)',padding:'8px 12px'}}>
      <div style={{fontSize:'11px',fontWeight:700,color:'#0369a1',marginBottom:4}}>Actes infirmiers enregistrés</div>
      {acts.map(a=><div key={a.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12px',padding:'2px 0'}}>
        <span>{a.description} <span style={{color:'var(--text-muted)'}}>— {a.by}</span></span>
        <span style={{fontWeight:600}}>{a.price>0?fmt(a.price):'gratuit'}</span>
      </div>)}
    </div>}
  </div>;
}

/* ===== LAB VIEW ===== */
function LabView({user,patients,setPatients,labOrders,setLabOrders,addNotification,payments,prescriptions,files,toast}){
  const [tab,setTab]=useState('pending');
  const [dossier,setDossier]=useState(null);
  const pending=labOrders.filter(o=>o.status==='pending');
  const completed=labOrders.filter(o=>o.status==='completed');

  const submitResult=async(orderId,result,pdfFile)=>{
    try{
      const now=new Date().toISOString();
      const {error}=await supabase.from('lab_orders').update({status:'completed',results:result,completed_at:now,completed_by:user.name}).eq('id',orderId);
      if(error)throw error;
      setLabOrders(labOrders.map(o=>o.id===orderId?{...o,status:'completed',results:result,completedAt:now,completedBy:user.name}:o));
      const order=labOrders.find(o=>o.id===orderId);
      if(order){
        // Send to NURSE (not directly to doctor — nurse sends to doctor after lab)
        await supabase.from('patients').update({step:2,step_label:'Infirmier (Résultats)',from_lab:true}).eq('id',order.patientId);
        setPatients(patients.map(p=>p.id===order.patientId?{...p,step:2,stepLabel:'Infirmier (Résultats)',fromLab:true}:p));
        const patient=patients.find(p=>p.id===order.patientId);
        if(patient?.doctorId){
          addNotification({type:'lab',patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,forDoctorId:patient.doctorId,forDoctorName:patient.doctorName||'',fromUser:user.name,message:`Résultats labo: ${order.description} → Infirmier`});
        }
      }
      toast.success('Résultats soumis → Infirmier → Médecin');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
  };

  const tabs=[
    {id:'pending',icon:'fas fa-flask',label:'En Attente',count:pending.length},
    {id:'completed',icon:'fas fa-check-double',label:'Complétés',count:completed.length},
  ];

  return <DashLayout user={user} tabs={tabs} activeTab={tab} setActiveTab={setTab}>
    {tab==='pending'&&<div>
      <div className="page-header"><div><h1>Ordres de Laboratoire</h1><p>{pending.length} analyse(s) en attente</p></div></div>
      {!pending.length&&<div className="card" style={{textAlign:'center',padding:30}}><p style={{color:'var(--text-light)'}}>Tous les examens sont traités</p></div>}
      {pending.map(o=><LabOrderCard key={o.id} order={o} patient={patients.find(p=>p.id===o.patientId)} onSubmit={submitResult}/>)}
    </div>}
    {tab==='completed'&&<div>
      <div className="page-header"><div><h1>Résultats Complétés</h1></div></div>
      <div className="card"><table><thead><tr><th>Patient</th><th>Examens</th><th>Résultats</th><th>Par</th><th>Date</th></tr></thead><tbody>
      {completed.map(o=><tr key={o.id}><td><strong>{o.patientName}</strong></td><td>{o.description}</td><td style={{fontSize:'12px',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis'}}>{o.results}</td><td>{o.completedBy}</td><td>{o.completedAt?new Date(o.completedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</td></tr>)}
      </tbody></table></div>
    </div>}
    {dossier&&<PatientDossier patient={dossier} payments={payments} labOrders={labOrders} prescriptions={prescriptions} confidentialNotes={[]} files={files} user={user} patients={patients} setPatients={setPatients} onClose={()=>setDossier(null)}/>}
  </DashLayout>;
}

/* ===== PHARMACY VIEW ===== */
function PharmacyView({user,patients,setPatients,inventory,setInventory,payments,setPayments,prescriptions,setPrescriptions,addNotification,labOrders,files,toast}){
  const [tab,setTab]=useState('payments');
  const [dossier,setDossier]=useState(null);
  const [editP,setEditP]=useState(null);
  const [search,setSearch]=useState('');
  const pharmacyQ=patients.filter(p=>[1,4,6].includes(p.step));
  const allPats=patients.filter(p=>p.step>=1);
  const filteredPats=search.length>=2?allPats.filter(p=>`${p.nom} ${p.prenom} ${p.phone} ${p.id}`.toLowerCase().includes(search.toLowerCase())):allPats;

  const payAndForward=async(patient,amount,description,nextStep,nextLabel)=>{
    const amt=parseInt(amount)||0;
    if(amt<=0){toast.error('Montant invalide.');return;}
    try{
      const pay={id:'PAY'+Date.now(),patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,amount:amt,description,insurance:patient.insurance,date:new Date().toISOString(),processedBy:user.name};
      const {error}=await supabase.from('payments').insert({id:pay.id,patient_id:patient.id,patient_name:pay.patientName,amount:amt,description,insurance:patient.insurance,date:pay.date,processed_by:user.name});
      if(error)throw error;
      await supabase.from('patients').update({step:nextStep,step_label:nextLabel,is_new:false}).eq('id',patient.id);
      setPayments([pay,...payments]);
      setPatients(patients.map(p=>p.id===patient.id?{...p,step:nextStep,stepLabel:nextLabel,isNew:false}:p));
      if(patient.doctorId){addNotification({type:'payment',patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,forDoctorId:patient.doctorId,forDoctorName:patient.doctorName||'',fromUser:user.name,message:`Paiement ${fmt(amt)} — ${description}`});}
      toast.success(`${fmt(amt)} encaissé → ${nextLabel}`);
    }catch(e){toast.error('Erreur paiement: '+(e.message||''));}
  };

  const tabs=[
    {id:'payments',icon:'fas fa-cash-register',label:'Caisse',count:pharmacyQ.length},
    {id:'allpats',icon:'fas fa-users',label:'Tous Patients'},
    {id:'prescriptions',icon:'fas fa-prescription',label:'Ordonnances'},
    {id:'inventory',icon:'fas fa-boxes-stacked',label:'Stock'},
    {id:'reports',icon:'fas fa-chart-line',label:'Rapports'},
  ];

  return <DashLayout user={user} tabs={tabs} activeTab={tab} setActiveTab={setTab}>
    {tab==='payments'&&<PharmacyPayments queue={pharmacyQ} payAndForward={payAndForward} payments={payments} labOrders={labOrders} prescriptions={prescriptions} patients={patients}/>}

    {tab==='allpats'&&<div>
      <div className="page-header"><div><h1>Tous les Patients</h1><p>{allPats.length} patient(s)</p></div></div>
      <div className="search-bar"><i className="fas fa-search"></i><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..."/></div>
      {filteredPats.map(p=>{
        const pPay=(payments||[]).filter(x=>x.patientId===p.id);
        const totalPaid=pPay.reduce((s,x)=>s+x.amount,0);
        return <div key={p.id} className="card" style={{borderLeft:`4px solid ${p.step===7?'var(--accent)':[1,4,6].includes(p.step)?'var(--gold)':'var(--border)'}`,marginBottom:10}}>
          <div className="card-header">
            <div style={{display:'flex',gap:10,alignItems:'center'}}><PatientAvatar patient={p}/><div>
              <div style={{fontWeight:700}}>{p.nom} {p.prenom}</div>
              <div className="patient-flow" style={{marginTop:6}}>{STEPS.map((s,i)=><span key={i} className={`flow-step ${i<p.step?'done':''} ${i===p.step?'current':''}`}>{s}</span>)}</div>
            </div></div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}><InsuranceBadge type={p.insurance}/><span className={`badge ${p.step===7?'badge-green':'badge-blue'}`}>{p.stepLabel}</span>{totalPaid>0&&<span style={{fontWeight:700,fontSize:'13px',color:'var(--primary)'}}>{fmt(totalPaid)}</span>}</div>
          </div>
          <PatientActivityFeed patientId={p.id} payments={payments} labOrders={labOrders} prescriptions={prescriptions} files={files} limit={3}/>
          <div style={{display:'flex',gap:8,marginTop:10,paddingTop:8,borderTop:'1px solid #eef0ee'}}>
            <button className="btn btn-sm btn-primary" onClick={()=>setDossier(p)}><i className="fas fa-folder-open"></i> Dossier</button>
            <button className="btn btn-sm btn-outline" onClick={()=>setEditP(p)}><i className="fas fa-pen"></i> Modifier</button>
          </div>
        </div>;
      })}
    </div>}

    {tab==='prescriptions'&&<PharmacyPrescriptions prescriptions={prescriptions} setPrescriptions={setPrescriptions} patients={patients} addNotification={addNotification} user={user} toast={toast}/>}
    {tab==='inventory'&&<PharmacyInventory inventory={inventory} setInventory={setInventory}/>}
    {tab==='reports'&&<PharmacyReports payments={payments}/>}

    {dossier&&<PatientDossier patient={dossier} payments={payments} labOrders={labOrders} prescriptions={prescriptions} confidentialNotes={[]} files={files} user={user} patients={patients} setPatients={setPatients} onClose={()=>setDossier(null)}/>}
    {editP&&<EditPatientModal patient={editP} patients={patients} setPatients={setPatients} onClose={()=>setEditP(null)}/>}
  </DashLayout>;
}

/* ===== PHARMACY PAYMENTS ===== */
function PharmacyPayments({queue,payAndForward,payments,labOrders,prescriptions,patients}){
  const [amounts,setAmounts]=useState({});
  return <div>
    <div className="page-header"><div><h1>Caisse — Paiements</h1><p>{queue.length} patient(s) en attente</p></div></div>
    {!queue.length&&<div className="card"><div className="empty-state"><div className="empty-state-icon"><i className="fas fa-cash-register"></i></div><div className="empty-state-title">Caisse à jour</div><div className="empty-state-body">Aucun paiement en attente.</div></div></div>}
    {queue.map(p=>{
      let desc='',nextStep=0,nextLabel='',suggested='',stepColor='var(--accent)',stepIcon='fa-stethoscope';
      const isHospDischarge=p.step===6&&p.hospitalization?.status==='discharged';
      if(p.step===1){desc='Consultation médicale';nextStep=2;nextLabel='Infirmier (Vitaux)';suggested='15000';stepColor='var(--accent)';stepIcon='fa-stethoscope';}
      else if(p.step===4){desc='Examens / Médicaments';nextStep=5;nextLabel='Laboratoire';suggested='25000';stepColor='var(--info-500)';stepIcon='fa-flask';}
      else if(p.step===6&&!isHospDischarge){desc='Frais de sortie';nextStep=7;nextLabel='Terminé';suggested='10000';stepColor='var(--gold-500)';stepIcon='fa-door-open';}
      else if(isHospDischarge){
        const acts=p.hospitalization?.acts||[];
        const actTotal=acts.reduce((s,a)=>s+a.price,0);
        desc=`Sortie hospitalisation (actes: ${fmt(actTotal)})`;nextStep=7;nextLabel='Terminé';suggested=String(actTotal+10000);stepColor='#0891b2';stepIcon='fa-bed';
      }
      const curVal=amounts[p.id]!==undefined?amounts[p.id]:suggested;
      const insInfo=INSURANCE_INFO[p.insurance]||INSURANCE_INFO['Régulier'];
      const discountPct=100-insInfo.rate;
      const baseAmt=parseInt(curVal)||0;
      const patientPays=Math.round(baseAmt*(insInfo.rate/100));
      const insCovers=baseAmt-patientPays;
      return <div key={p.id} className="card" style={{borderLeft:`3px solid ${stepColor}`,marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:20}}>
          <div style={{flex:1,minWidth:280}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
              <PatientAvatar patient={p}/>
              <div>
                <div style={{fontWeight:700,fontSize:'15px'}}>{p.nom} {p.prenom}</div>
                <div style={{fontSize:'12px',color:'var(--text-muted)',marginTop:2}}>{p.id} · {p.phone}</div>
              </div>
            </div>
            <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
              <InsuranceBadge type={p.insurance}/>
              <span className="badge" style={{background:`${stepColor}1a`,color:stepColor}}><i className={`fas ${stepIcon}`} style={{fontSize:'9px'}}></i> {desc}</span>
              {isHospDischarge&&<span style={{background:'#e0f2fe',color:'#0369a1',padding:'3px 10px',borderRadius:20,fontSize:'11px',fontWeight:600}}><i className="fas fa-bed"></i> Chambre {p.hospitalization.room}</span>}
            </div>
            <div className="patient-flow">{STEPS.map((s,i)=><span key={i} className={`flow-step ${i<p.step?'done':''} ${i===p.step?'current':''}`}>{s}</span>)}</div>
            {isHospDischarge&&p.hospitalization.acts?.length>0&&<div style={{marginTop:8,fontSize:'12px',padding:'8px 12px',background:'#e0f2fe',borderRadius:'var(--r-sm)'}}>
              <strong>Actes infirmiers à facturer:</strong>
              {p.hospitalization.acts.map(a=><div key={a.id} style={{display:'flex',justifyContent:'space-between',marginTop:2}}><span>{a.description}</span><span>{fmt(a.price)}</span></div>)}
            </div>}
            <PatientActivityFeed patientId={p.id} payments={payments} labOrders={labOrders} prescriptions={prescriptions} limit={3}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10,minWidth:260}}>
            <label style={{fontSize:'10px',fontWeight:700,color:'var(--gold-600)',letterSpacing:'1px',textTransform:'uppercase'}}><i className="fas fa-money-bill-wave"></i> Montant total</label>
            <div className="pay-input-wrap">
              <input type="number" inputMode="numeric" placeholder={suggested} value={curVal} onChange={e=>setAmounts({...amounts,[p.id]:e.target.value})}/>
              <span className="currency">CDF</span>
            </div>
            {/* Insurance calculation */}
            {p.insurance!=='Régulier'&&baseAmt>0&&<div style={{fontSize:'11px',background:'var(--ink-25)',padding:'8px 10px',borderRadius:'var(--r-sm)',border:'1px solid var(--border-subtle)'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span>Montant total:</span><strong>{fmt(baseAmt)}</strong></div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:3,color:'var(--success-600)'}}><span>Couvert par {p.insurance} ({discountPct}%):</span><strong>-{fmt(insCovers)}</strong></div>
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:'12px',paddingTop:3,borderTop:'1px solid var(--border)'}}><span>Patient paie ({insInfo.rate}%):</span><strong style={{color:'var(--primary-700)'}}>{fmt(patientPays>0?patientPays:baseAmt)}</strong></div>
            </div>}
            <button className="btn btn-success btn-lg" onClick={()=>payAndForward(p,curVal||suggested,desc,nextStep,nextLabel)} style={{justifyContent:'center'}}><i className="fas fa-check-circle"></i> Encaisser & Transférer</button>
            <div style={{fontSize:'10.5px',color:'var(--text-muted)',textAlign:'center'}}>→ {nextLabel}</div>
          </div>
        </div>
      </div>;
    })}
  </div>;
}

/* ===== PHARMACY PRESCRIPTIONS ===== */
function PharmacyPrescriptions({prescriptions,setPrescriptions,patients,addNotification,user,toast}){
  const pending=prescriptions.filter(r=>!r.dispensed);
  const done=prescriptions.filter(r=>r.dispensed);
  const dispense=async id=>{
    try{
      const now=new Date().toISOString();
      const {error}=await supabase.from('prescriptions').update({dispensed:true,dispensed_at:now}).eq('id',id);
      if(error)throw error;
      setPrescriptions(prescriptions.map(r=>r.id===id?{...r,dispensed:true,dispensedAt:now}:r));
      const rx=prescriptions.find(r=>r.id===id);
      if(rx&&patients){
        const pat=patients.find(p=>p.id===rx.patientId);
        if(pat?.doctorId)addNotification({type:'prescription',patientId:pat.id,patientName:`${pat.nom} ${pat.prenom}`,forDoctorId:pat.doctorId,forDoctorName:pat.doctorName||'',fromUser:user.name,message:`Prescription dispensée: ${rx.content.substring(0,50)}`});
      }
      toast.success('Médicaments dispensés');
    }catch(e){toast.error('Erreur');}
  };
  return <div>
    <div className="page-header"><div><h1>Ordonnances</h1><p>{pending.length} en attente</p></div></div>
    {!pending.length&&<div className="card"><p style={{textAlign:'center',padding:20,color:'var(--text-light)'}}>Toutes dispensées</p></div>}
    {pending.map(r=><div key={r.id} className="card" style={{borderLeft:'4px solid var(--warning)',marginBottom:10}}>
      <div className="card-header"><h3><i className="fas fa-pills"></i> {r.patientName}</h3><span className="badge badge-yellow">À dispenser</span></div>
      <div style={{background:'#fffbf5',borderRadius:8,padding:12,margin:'8px 0',fontSize:'13px',fontWeight:500}}>{r.content}</div>
      <div style={{fontSize:'11px',color:'var(--text-muted)'}}>{r.prescribedBy} · {new Date(r.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
      <button className="btn btn-success btn-sm" style={{marginTop:10}} onClick={()=>dispense(r.id)}><i className="fas fa-check"></i> Dispensé</button>
    </div>)}
    {done.length>0&&<><h3 style={{margin:'24px 0 12px',color:'var(--text-light)'}}>Dispensés</h3>
    <div className="card"><table><thead><tr><th>Patient</th><th>Prescription</th><th>Par</th><th>À</th></tr></thead><tbody>
    {done.slice(0,15).map(r=><tr key={r.id}><td>{r.patientName}</td><td style={{fontSize:'12px'}}>{r.content}</td><td>{r.prescribedBy}</td><td>{r.dispensedAt?new Date(r.dispensedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</td></tr>)}
    </tbody></table></div></>}
  </div>;
}

/* ===== PHARMACY INVENTORY ===== */
function PharmacyInventory({inventory}){
  const [q,setQ]=useState('');
  const [catF,setCatF]=useState('all');
  const [stF,setStF]=useState('all');
  const cats=[...new Set(inventory.map(m=>m.category))].sort();
  let filtered=inventory.filter(m=>!q||m.name.toLowerCase().includes(q.toLowerCase())).filter(m=>catF==='all'||m.category===catF).filter(m=>stF==='all'||(stF==='low'?m.stock<=m.minStock:m.stock>m.minStock));
  const low=inventory.filter(m=>m.stock<=m.minStock);
  const val=inventory.reduce((s,m)=>s+m.stock*m.price,0);
  return <div>
    <div className="page-header"><div><h1>Inventaire Pharmacie</h1></div></div>
    <div className="stats-grid">
      <div className="stat-card"><div className="stat-icon green"><i className="fas fa-pills"></i></div><div className="stat-value">{inventory.length}</div><div className="stat-label">Produits</div></div>
      <div className="stat-card danger"><div className="stat-icon red"><i className="fas fa-triangle-exclamation"></i></div><div className="stat-value">{low.length}</div><div className="stat-label">Stock Critique</div></div>
      <div className="stat-card gold"><div className="stat-icon gold"><i className="fas fa-coins"></i></div><div className="stat-value" style={{fontSize:'20px'}}>{fmt(val)}</div><div className="stat-label">Valeur Stock</div></div>
    </div>
    {low.length>0&&<div className="card" style={{borderLeft:'4px solid var(--danger)',background:'#fffbfb',marginBottom:16}}>
      <h3><i className="fas fa-triangle-exclamation"></i> Stock Critique</h3>
      <table><thead><tr><th>Médicament</th><th>Stock</th><th>Minimum</th><th>Fournisseur</th></tr></thead><tbody>
      {low.map(m=><tr key={m.id}><td><strong>{m.name}</strong></td><td style={{color:'var(--danger-600)',fontWeight:600}}>{m.stock} {m.unit}</td><td>{m.minStock}</td><td>{m.supplier}</td></tr>)}
      </tbody></table>
    </div>}
    <div className="filter-bar">
      <input placeholder="Rechercher..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1}}/>
      <select value={catF} onChange={e=>setCatF(e.target.value)}><option value="all">Toutes catégories</option>{cats.map(c=><option key={c}>{c}</option>)}</select>
      <select value={stF} onChange={e=>setStF(e.target.value)}><option value="all">Tout stock</option><option value="low">Stock bas</option><option value="ok">En stock</option></select>
    </div>
    <div className="card"><table><thead><tr><th>Médicament</th><th>Catégorie</th><th>Stock</th><th>Statut</th><th>Prix</th></tr></thead><tbody>
    {filtered.map(m=>{const pct=Math.min(Math.round(m.stock/Math.max(m.minStock*2,1)*100),100);const isLow=m.stock<=m.minStock;return<tr key={m.id}>
      <td><strong>{m.name}</strong></td><td><span className="badge badge-blue">{m.category}</span></td>
      <td>{m.stock} {m.unit}<div className="stock-bar"><div className="stock-bar-fill" style={{width:pct+'%',background:isLow?'#d64545':'#52b788'}}/></div></td>
      <td>{isLow?<span className="badge badge-red"><i className="fas fa-exclamation-circle"></i> CRITIQUE</span>:<span className="badge badge-green">OK</span>}</td>
      <td style={{fontWeight:600}}>{fmt(m.price)}</td>
    </tr>;})}
    </tbody></table></div>
  </div>;
}

/* ===== PHARMACY REPORTS ===== */
function PharmacyReports({payments}){
  const [filter,setFilter]=useState('all');
  const filtered=filter==='all'?payments:payments.filter(p=>p.insurance===filter);
  const total=filtered.reduce((s,p)=>s+p.amount,0);
  const totalAll=payments.reduce((s,p)=>s+p.amount,0);
  const byIns=INSURANCE_TYPES.map(t=>({type:t,total:payments.filter(p=>p.insurance===t).reduce((s,p)=>s+p.amount,0),count:payments.filter(p=>p.insurance===t).length}));
  return <div>
    <div className="page-header"><div><h1>Rapports Financiers</h1></div><button className="btn btn-outline btn-sm" onClick={()=>window.print()}><i className="fas fa-print"></i> Imprimer</button></div>
    <div className="stats-grid">
      <div className="stat-card gold"><div className="stat-icon gold"><i className="fas fa-money-bill-wave"></i></div><div className="stat-value" style={{fontSize:'20px'}}>{fmt(totalAll)}</div><div className="stat-label">Revenu total</div><div className="stat-trend">{payments.length} transactions</div></div>
      <div className="stat-card"><div className="stat-icon green"><i className="fas fa-receipt"></i></div><div className="stat-value">{payments.length}</div><div className="stat-label">Transactions</div></div>
      <div className="stat-card info"><div className="stat-icon blue"><i className="fas fa-calculator"></i></div><div className="stat-value" style={{fontSize:'18px'}}>{payments.length>0?fmt(Math.round(totalAll/payments.length)):'—'}</div><div className="stat-label">Ticket moyen</div></div>
    </div>
    <div className="card">
      <h3><i className="fas fa-chart-column"></i> Par assurance</h3>
      <table><thead><tr><th>Catégorie</th><th>Description</th><th>Patients</th><th className="num">Total</th><th className="num">Part</th></tr></thead><tbody>
      {byIns.map(b=>{const pct=totalAll>0?(b.total/totalAll*100):0;return<tr key={b.type}>
        <td><InsuranceBadge type={b.type}/></td>
        <td style={{fontSize:'11px',color:'var(--text-muted)'}}>{INSURANCE_INFO[b.type]?.desc}</td>
        <td>{b.count}</td>
        <td className="num" style={{fontWeight:700,color:'var(--primary-700)'}}>{fmt(b.total)}</td>
        <td className="num" style={{color:'var(--text-muted)'}}>{pct.toFixed(1)}%</td>
      </tr>;})}
      </tbody></table>
    </div>
    <div className="filter-bar"><label style={{fontWeight:700,fontSize:'11px',textTransform:'uppercase',letterSpacing:'.6px',color:'var(--text-light)'}}>Filtrer</label>
      <select value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">Toutes catégories</option>{INSURANCE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select>
    </div>
    <div className="card">
      <h3>Transactions {filter!=='all'&&<span style={{color:'var(--gold-600)'}}> — {filter}</span>}</h3>
      <table><thead><tr><th>Heure</th><th>Patient</th><th>Service</th><th>Assurance</th><th className="num">Montant</th><th>Caissier</th></tr></thead><tbody>
      {filtered.map(p=><tr key={p.id}><td>{new Date(p.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td><td><strong>{p.patientName}</strong></td><td>{p.description}</td><td><InsuranceBadge type={p.insurance} size="badge-sm"/></td><td className="num" style={{fontWeight:700,color:'var(--primary-700)'}}>{fmt(p.amount)}</td><td>{p.processedBy}</td></tr>)}
      </tbody></table>
      {filtered.length>0&&<div style={{textAlign:'right',padding:'12px 14px',borderTop:'2px solid var(--primary-700)',marginTop:8,fontWeight:700,fontSize:'15px',color:'var(--primary-700)'}}>TOTAL: {fmt(total)}</div>}
      {!filtered.length&&<div className="empty-state" style={{padding:'24px'}}><div className="empty-state-title">Aucune transaction</div></div>}
    </div>
  </div>;
}

  </DashLayout>;

/* ===== AI ASSISTANT ===== */
function AIAssistant({user}){
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([{role:'bot',text:`${greeting()} ${user.name.split(' ')[0]}! Je suis l'assistant IA. Comment puis-je aider?`}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [pos,setPos]=useState({x:window.innerWidth-80,y:window.innerHeight-80});
  const [dragging,setDragging]=useState(false);
  const [hasDragged,setHasDragged]=useState(false);
  const offsetRef=useRef({x:0,y:0});
  const bodyRef=useRef();
  const onMouseDown=e=>{setDragging(true);setHasDragged(false);offsetRef.current={x:e.clientX-pos.x,y:e.clientY-pos.y};};
  useEffect(()=>{
    const onMove=e=>{if(dragging){setHasDragged(true);setPos({x:Math.max(0,Math.min(window.innerWidth-60,e.clientX-offsetRef.current.x)),y:Math.max(0,Math.min(window.innerHeight-60,e.clientY-offsetRef.current.y))});}};
    const onUp=()=>setDragging(false);
    window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[dragging]);
  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;},[msgs]);
  const handleClick=()=>{if(!hasDragged)setOpen(!open);};
  const send=async()=>{
    if(!input.trim()||loading)return;
    const txt=input;setMsgs(m=>[...m,{role:'user',text:txt}]);setInput('');setLoading(true);
    setTimeout(()=>{setMsgs(m=>[...m,{role:'bot',text:'L\'assistant IA n\'est pas configuré. Contactez l\'administrateur.'}]);setLoading(false);},500);
  };
  return <>
    <div className="ai-fab" style={{left:pos.x,top:pos.y}} onMouseDown={onMouseDown} onClick={handleClick} title="Assistant IA">
      <i className={`fas ${open?'fa-times':'fa-robot'}`}></i>
    </div>
    {open&&<div className="ai-panel">
      <div className="ai-panel-header"><span><i className="fas fa-robot"></i> Assistant IA</span><span style={{cursor:'pointer',fontSize:18}} onClick={()=>setOpen(false)}>×</span></div>
      <div className="ai-panel-body" ref={bodyRef}>
        {msgs.map((m,i)=><div key={i} className={`ai-msg ${m.role}`}>{m.text}</div>)}
        {loading&&<div className="ai-msg bot"><i className="fas fa-spinner fa-spin"></i></div>}
      </div>
      <div className="ai-panel-input">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="Posez votre question..." style={{flex:1,padding:'9px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-md)'}}/>
        <button className="btn btn-sm btn-primary" onClick={send}><i className="fas fa-paper-plane"></i></button>
      </div>
    </div>}
  </>;
}
