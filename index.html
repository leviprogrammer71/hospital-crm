<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinique The Grace of God - Système CRM v3</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
*:focus-visible{outline:2px solid var(--primary-400);outline-offset:2px;border-radius:4px}
:root{
  --primary-50:#eff4f2;--primary-100:#d8e5e0;--primary-200:#b1cbc1;--primary-300:#7eab9d;
  --primary-400:#4f8a78;--primary-500:#2e6e5a;--primary-600:#1f5747;
  --primary-700:#1a3c34;--primary-800:#142e28;--primary-900:#0c1f1a;
  --primary:#1a3c34;--primary-light:#2a5c4c;--secondary:#2e7d5b;--accent:#3a9d6e;
  --gold-50:#fbf7ee;--gold-100:#f4ead0;--gold-200:#e8d39d;--gold-300:#d9b566;
  --gold-400:#c89a3f;--gold-500:#b0822c;--gold-600:#8a6624;
  --gold:#9a7536;--gold-light:#f4ead0;
  --success-50:#e8f3ec;--success-100:#cfe6d6;--success-500:#2e8a5b;--success-600:#1d6d44;--success-700:#0e4a2c;
  --warning-50:#fbf2dc;--warning-100:#f5e2a8;--warning-500:#c08a1d;--warning-600:#8c6310;--warning-700:#5e4108;
  --danger-50:#fbe9e9;--danger-100:#f3c8c8;--danger-500:#b83230;--danger-600:#8c2422;--danger-700:#601817;
  --info-50:#e7eef8;--info-100:#c7d8ee;--info-500:#2563a8;--info-600:#1b4a83;--info-700:#0f315a;
  --warning:#c08a1d;--danger:#b83230;--info:#2563a8;
  --ink-900:#0c1816;--ink-800:#1a2823;--ink-700:#2a3a34;--ink-600:#3d524b;
  --ink-500:#5a6e67;--ink-400:#7d8d87;--ink-300:#a4b2ad;--ink-200:#c8d2ce;
  --ink-100:#e2e8e5;--ink-50:#eef1ef;--ink-25:#f6f8f7;
  --bg:#f3f5f3;--bg-subtle:#eaeeec;--surface:#ffffff;
  --text:#142823;--text-light:#5a6e67;--text-muted:#7d8d87;
  --border:#dde3df;--border-strong:#c8d2ce;--border-subtle:#e8ede9;
  --fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:16px;--fs-xl:18px;
  --fs-2xl:22px;--fs-3xl:28px;
  --lh-tight:1.2;--lh-snug:1.35;--lh-normal:1.55;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--s-8:40px;--s-9:48px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
  --e-1:0 1px 2px rgba(20,40,35,.04),0 1px 3px rgba(20,40,35,.06);
  --e-2:0 2px 4px rgba(20,40,35,.04),0 4px 12px rgba(20,40,35,.08);
  --e-3:0 4px 8px rgba(20,40,35,.06),0 12px 28px rgba(20,40,35,.12);
  --e-4:0 8px 16px rgba(20,40,35,.08),0 24px 48px rgba(20,40,35,.16);
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --dur-fast:120ms;--dur-base:180ms;--dur-slow:280ms;
  --sidebar-w:252px;--topbar-h:56px;--content-max:1640px;
}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-md);line-height:var(--lh-normal);-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,h5,h6{font-weight:600;line-height:var(--lh-snug);color:var(--text);letter-spacing:-.01em}
h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em}
h2{font-size:var(--fs-xl)}
h3{font-size:var(--fs-lg)}
a{color:var(--primary-500);text-decoration:none}
::selection{background:var(--gold-100);color:var(--primary-800)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 60% 50% at 80% -10%, rgba(154,117,54,.10), transparent 60%),radial-gradient(ellipse 60% 50% at -10% 110%, rgba(46,125,91,.12), transparent 60%),linear-gradient(180deg, #f3f5f3 0%, #eaeeec 100%);padding:var(--s-4);}
.login-card{background:var(--surface);border-radius:var(--r-xl);padding:var(--s-9) var(--s-8);width:460px;max-width:100%;box-shadow:var(--e-4);border:1px solid var(--border-subtle);animation:loginEntrance 600ms var(--ease-out);}
@keyframes loginEntrance{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-card .logo-fallback{width:72px;height:72px;border-radius:var(--r-lg);margin:0 auto var(--s-3);background:linear-gradient(135deg,var(--primary-700) 0%,var(--primary-500) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:var(--e-2);}
/* FORMS */
.form-group{margin-bottom:var(--s-4)}
.form-group label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-xs);color:var(--ink-500);text-transform:uppercase;letter-spacing:.6px;margin-bottom:var(--s-2);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-base);background:var(--surface);color:var(--text);transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary-500);box-shadow:0 0 0 3px rgba(46,110,90,.14);}
.form-group input:disabled,.form-group select:disabled{background:var(--ink-25);color:var(--text-muted);cursor:not-allowed}
.form-group textarea{resize:vertical;min-height:80px;line-height:var(--lh-normal)}
.form-group select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-500) 50%),linear-gradient(135deg,var(--ink-500) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
/* BUTTONS */
.btn{padding:9px 16px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;font-size:var(--fs-md);cursor:pointer;transition:background var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;line-height:1;user-select:none;}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn-primary{background:var(--primary-700);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--e-1)}
.btn-primary:hover{background:var(--primary-600)}
.btn-success{background:var(--success-500);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--e-1)}
.btn-success:hover{background:var(--success-600)}
.btn-danger{background:var(--danger-500);color:#fff}
.btn-danger:hover{background:var(--danger-600)}
.btn-warning{background:var(--warning-500);color:#fff}
.btn-warning:hover{background:var(--warning-600)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-600)}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-outline:hover{background:var(--ink-25);border-color:var(--border-strong)}
.btn-info{background:var(--info-500);color:#fff}
.btn-info:hover{background:var(--info-600)}
.btn-sm{padding:5px 11px;font-size:var(--fs-sm)}
.btn-lg{padding:12px 22px;font-size:var(--fs-base)}
.btn-block{width:100%;justify-content:center}
.btn.loading{opacity:.75;pointer-events:none}
/* LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden;background:var(--bg)}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--primary-800) 0%,var(--primary-700) 60%,var(--primary-800) 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid rgba(0,0,0,.2);}
.sidebar-header{padding:var(--s-5) var(--s-5) var(--s-4);border-bottom:1px solid rgba(255,255,255,.06)}
.brand-icon{width:40px;height:40px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--gold-400),var(--gold-600));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
.sidebar-nav{flex:1;padding:var(--s-3);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:var(--s-3);padding:9px 12px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast);font-size:var(--fs-md);color:rgba(255,255,255,.62);border-radius:var(--r-md);position:relative;font-weight:500;}
.nav-item i{width:18px;text-align:center;font-size:13px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(58,157,110,.2) 0%,rgba(58,157,110,.08) 100%);color:#fff;font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:-3px;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--gold-400);border-radius:0 3px 3px 0;}
.nav-item.active i{color:var(--gold-300);opacity:1}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;padding:2px 7px;border-radius:var(--r-full);font-size:10px;font-weight:700;}
.nav-item.active .nav-badge{background:var(--gold-500)}
.nav-section-label{padding:var(--s-4) var(--s-4) var(--s-1);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3);}
.sidebar-footer{padding:var(--s-4) var(--s-5);border-top:1px solid rgba(255,255,255,.06)}
.content-shell{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-6);flex-shrink:0;z-index:4;}
.topbar-spacer{flex:1}
.topbar-clock{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--ink-25);border:1px solid var(--border-subtle);border-radius:var(--r-md);font-size:var(--fs-sm);color:var(--text-light);font-weight:500;}
.topbar-clock .dot{width:6px;height:6px;border-radius:50%;background:var(--success-500);box-shadow:0 0 0 3px rgba(46,138,91,.18);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.main-content{flex:1;overflow-y:auto;padding:var(--s-7) var(--s-7) var(--s-9);background:var(--bg);}
.main-content>*{max-width:var(--content-max);margin-left:auto;margin-right:auto}
.page-header{margin-bottom:var(--s-6);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s-4);animation:fadeUp var(--dur-slow) var(--ease-out);}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* CARDS */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s-6);box-shadow:var(--e-1);margin-bottom:var(--s-4);border:1px solid var(--border-subtle);transition:box-shadow var(--dur-base);animation:fadeUp var(--dur-slow) var(--ease-out);}
.card:hover{box-shadow:var(--e-2)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--s-4);gap:var(--s-4);flex-wrap:wrap}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s-4);margin-bottom:var(--s-6)}
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s-5) var(--s-5) var(--s-4);box-shadow:var(--e-1);border:1px solid var(--border-subtle);position:relative;overflow:hidden;transition:transform var(--dur-base),box-shadow var(--dur-base);}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--e-2)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--primary-500));}
.stat-card.gold::before{background:linear-gradient(90deg,var(--gold-400),var(--gold-600))}
.stat-card.danger::before{background:linear-gradient(90deg,#d96363,var(--danger-500))}
.stat-card.info::before{background:linear-gradient(90deg,#4d8ec9,var(--info-500))}
.stat-card.purple::before{background:linear-gradient(90deg,#a855f7,#7c3aed)}
.stat-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:var(--s-3);}
.stat-icon.green{background:var(--success-50);color:var(--success-600)}
.stat-icon.gold{background:var(--gold-100);color:var(--gold-600)}
.stat-icon.red{background:var(--danger-50);color:var(--danger-600)}
.stat-icon.blue{background:var(--info-50);color:var(--info-600)}
.stat-icon.purple{background:#efe9f7;color:#7c3aed}
.stat-value{font-size:var(--fs-3xl);font-weight:700;color:var(--text);letter-spacing:-.02em;line-height:1.1}
.stat-label{font-size:var(--fs-sm);color:var(--text-light);margin-top:var(--s-1);font-weight:500}
.stat-trend{font-size:var(--fs-xs);margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:6px;color:var(--text-light);}
/* TABLE */
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 14px;text-align:left;font-size:var(--fs-sm);vertical-align:middle}
th{background:var(--ink-25);font-weight:600;color:var(--text-light);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);border-top:1px solid var(--border-subtle);position:sticky;top:0;z-index:1;}
td{border-bottom:1px solid var(--border-subtle);color:var(--text)}
tbody tr:nth-child(even) td{background:var(--ink-25)}
tbody tr:hover td{background:var(--primary-50)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
/* BADGES */
.badge{padding:3px 9px;border-radius:var(--r-full);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;line-height:1.4;white-space:nowrap;}
.badge-green{background:var(--success-50);color:var(--success-700);box-shadow:inset 0 0 0 1px var(--success-100)}
.badge-yellow{background:var(--warning-50);color:var(--warning-700);box-shadow:inset 0 0 0 1px var(--warning-100)}
.badge-red{background:var(--danger-50);color:var(--danger-700);box-shadow:inset 0 0 0 1px var(--danger-100)}
.badge-blue{background:var(--info-50);color:var(--info-700);box-shadow:inset 0 0 0 1px var(--info-100)}
.badge-gold{background:var(--gold-100);color:var(--gold-600);box-shadow:inset 0 0 0 1px rgba(154,117,54,.18)}
.badge-purple{background:#efe9f7;color:#4a3080;box-shadow:inset 0 0 0 1px #d7c6f0}
.badge-gray{background:var(--ink-50);color:var(--ink-600);box-shadow:inset 0 0 0 1px var(--ink-100)}
.badge-new{background:linear-gradient(135deg,var(--accent),var(--primary-500));color:#fff;font-size:9.5px;font-weight:700;}
.badge-sm{padding:1.5px 7px;font-size:10px}
.ins-regulier{background:var(--ink-50);color:var(--ink-700);box-shadow:inset 0 0 0 1px var(--ink-100)}
.ins-csu{background:#e7f1ec;color:#185a3c;box-shadow:inset 0 0 0 1px #c8e0d0}
.ins-academia{background:#e8eff8;color:#1c4e85;box-shadow:inset 0 0 0 1px #c8d8ec}
.ins-amc{background:#f3edd9;color:#7a5a10;box-shadow:inset 0 0 0 1px #e2d5a8}
.ins-activa{background:#f1e7f0;color:#673366;box-shadow:inset 0 0 0 1px #dec6dd}
/* PATIENT FLOW */
.patient-flow{display:flex;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--ink-25);border-radius:var(--r-md);border:1px solid var(--border-subtle)}
.flow-step{position:relative;padding:5px 10px 5px 24px;font-size:10px;font-weight:600;color:var(--text-muted);}
.flow-step::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--ink-100);border:2px solid var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong);transition:all var(--dur-base);}
.flow-step:not(:last-child)::after{content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:8px;height:2px;background:var(--ink-100);}
.flow-step.done{color:var(--success-600)}
.flow-step.done::before{background:var(--success-500);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--success-500)}
.flow-step.done:not(:last-child)::after{background:var(--success-500)}
.flow-step.current{color:var(--primary-700);font-weight:700}
.flow-step.current::before{background:var(--gold-400);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--gold-500),0 0 0 4px rgba(216,181,102,.25);animation:pulseStep 2s infinite;}
@keyframes pulseStep{0%,100%{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--gold-500),0 0 0 4px rgba(216,181,102,.25)}50%{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1px var(--gold-500),0 0 0 7px rgba(216,181,102,.12)}}
/* AVATARS */
.p-avatar{width:42px;height:42px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-md);color:#fff;flex-shrink:0;}
.p-avatar.male{background:linear-gradient(135deg,#3b6e9a,#2a527a)}
.p-avatar.female{background:linear-gradient(135deg,#b96894,#8a456e)}
.p-avatar.unk{background:linear-gradient(135deg,var(--ink-400),var(--ink-500))}
.p-avatar.sm{width:32px;height:32px;font-size:var(--fs-xs)}
.p-avatar.lg{width:56px;height:56px;font-size:var(--fs-xl)}
/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(12,24,22,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:var(--s-4);animation:fadeIn var(--dur-base);}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:var(--s-7);width:580px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--e-4);border:1px solid var(--border-subtle);animation:modalIn var(--dur-base);}
.modal-lg{width:780px}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h2{font-size:var(--fs-xl);font-weight:700;margin-bottom:var(--s-5);color:var(--text);display:flex;align-items:center;gap:var(--s-2)}
/* DOSSIER */
.dossier-overlay{position:fixed;inset:0;background:rgba(12,24,22,.6);backdrop-filter:blur(6px);z-index:1200;display:flex;align-items:center;justify-content:center;padding:var(--s-4);animation:fadeIn var(--dur-base);}
.dossier-panel{background:var(--surface);width:920px;max-width:100%;max-height:92vh;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--e-4);display:flex;flex-direction:column;animation:modalIn var(--dur-base);}
.dossier-header{padding:var(--s-5) var(--s-6);background:linear-gradient(135deg,var(--primary-700),var(--primary-800));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:var(--s-4);}
.dossier-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 var(--s-6);overflow-x:auto;flex-shrink:0;}
.dossier-tab{padding:13px 18px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--text-light);border-bottom:2px solid transparent;transition:all var(--dur-fast);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.dossier-tab.active{color:var(--primary-700);border-bottom-color:var(--gold-400)}
.dossier-tab .ct{background:var(--ink-100);color:var(--text-light);padding:1px 7px;border-radius:var(--r-full);font-size:10px;font-weight:700}
.dossier-tab.active .ct{background:var(--gold-100);color:var(--gold-600)}
.dossier-body{flex:1;overflow-y:auto;padding:var(--s-6);background:var(--ink-25)}

function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const add=(msg,type='success',dur=4000)=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),dur);};
  const toast={success:m=>add(m,'success'),error:m=>add(m,'error',6000),info:m=>add(m,'info'),warning:m=>add(m,'warning',5000)};
  return React.createElement(ToastContext.Provider,{value:toast},children,
    React.createElement('div',{className:'toast-container'},toasts.map(t=>
      React.createElement('div',{key:t.id,className:`toast ${t.type}`},
        React.createElement('i',{className:`fas ${t.type==='success'?'fa-check-circle':t.type==='error'?'fa-exclamation-circle':t.type==='warning'?'fa-exclamation-triangle':'fa-info-circle'}`}),
        React.createElement('span',null,t.msg),
        React.createElement('span',{className:'toast-close',onClick:()=>setToasts(p=>p.filter(x=>x.id!==t.id))},'×')
      )
    ))
  );
}

  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,limit);
  if(!all.length)return null;
  return <div style={{marginTop:8,borderTop:'1px solid #eef0ee',paddingTop:8}}>
    <div style={{fontSize:'10px',fontWeight:700,color:'var(--text-light)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:6}}>Activité récente</div>
    {all.map((a,i)=><div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:'11.5px',padding:'3px 0',color:'var(--text)'}}>
      <i className={`fas ${a.icon}`} style={{color:a.color,width:12,marginTop:2,fontSize:'10px'}}></i>
      <div style={{flex:1}}>{a.text} <span style={{color:'var(--text-light)',fontSize:'10px'}}>— {a.by}</span></div>
    </div>)}
  </div>;
}

/* ===== FILE UPLOAD COMPONENT ===== */
function FileUpload({patientId,patientName,uploadedBy,onUploaded,toast}){
  const [uploading,setUploading]=useState(false);
  const [drag,setDrag]=useState(false);
  const fileRef=useRef();

  const handleFiles=async(fileList)=>{
    if(!fileList||!fileList.length)return;
    setUploading(true);
    try{
      for(const file of Array.from(fileList)){
        const ext=file.name.split('.').pop().toLowerCase();
        const allowed=['pdf','jpg','jpeg','png','gif','docx','xlsx'];
        if(!allowed.includes(ext)){toast.error(`Type non supporté: .${ext}`);continue;}
        if(file.size>15*1024*1024){toast.error(`Fichier trop grand (max 15MB): ${file.name}`);continue;}
        const path=`patients/${patientId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
        const {error:upErr}=await supabase.storage.from('patient-files').upload(path,file,{upsert:false});
        if(upErr&&upErr.message.includes('Bucket not found')){
          // Save metadata only if bucket not set up
          const meta={id:'FILE'+Date.now(),patientId,patientName,name:file.name,type:file.type,size:file.size,path:'local_only',uploadedBy,uploadedAt:new Date().toISOString()};
          await supabase.from('patient_files').insert(meta).catch(()=>{});
          onUploaded&&onUploaded(meta);
          toast.info(`${file.name} enregistré (stockage local)`);
        } else if(upErr){
          toast.error(`Erreur upload: ${upErr.message}`);
        } else {
          const {data:{publicUrl}}=supabase.storage.from('patient-files').getPublicUrl(path);
          const meta={id:'FILE'+Date.now(),patientId,patientName,name:file.name,type:file.type,size:file.size,path,url:publicUrl,uploadedBy,uploadedAt:new Date().toISOString()};
          await supabase.from('patient_files').insert(meta).catch(()=>{});
          onUploaded&&onUploaded(meta);
          toast.success(`${file.name} uploadé`);
        }
      }
    }catch(e){toast.error('Erreur upload: '+(e.message||''));}
    setUploading(false);
    if(fileRef.current)fileRef.current.value='';
  };

  return <div>
    <div className={`file-upload-area ${drag?'drag-over':''}`}
      onClick={()=>fileRef.current&&fileRef.current.click()}
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handleFiles(e.dataTransfer.files);}}>
      {uploading?<><i className="fas fa-spinner fa-spin" style={{fontSize:24,color:'var(--primary-500)'}}></i><div style={{marginTop:8,fontSize:'13px',color:'var(--text-light)'}}>Upload en cours...</div></>
        :<><i className="fas fa-cloud-upload-alt" style={{fontSize:28,color:'var(--primary-400)'}}></i>
          <div style={{marginTop:8,fontWeight:600,fontSize:'13px',color:'var(--text)'}}>Glisser ou cliquer pour uploader</div>
          <div style={{fontSize:'11px',color:'var(--text-muted)',marginTop:4}}>PDF, Images, DOCX — max 15MB</div></>}
    </div>
    <input ref={fileRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.docx,.xlsx" style={{display:'none'}} onChange={e=>handleFiles(e.target.files)}/>
  </div>;
}

/* ===== FILE LIST ===== */
function FileList({files,patientId,canDelete,onDelete}){
  const pFiles=(files||[]).filter(f=>f.patientId===patientId);
  if(!pFiles.length)return <div style={{color:'var(--text-muted)',fontSize:'13px',textAlign:'center',padding:'20px'}}>Aucun fichier attaché</div>;
  const icon=t=>{if(!t)return 'fa-file';if(t.includes('pdf'))return 'fa-file-pdf';if(t.includes('image'))return 'fa-file-image';if(t.includes('word'))return 'fa-file-word';return 'fa-file';};
  const color=t=>{if(!t)return '#666';if(t.includes('pdf'))return '#dc2626';if(t.includes('image'))return '#0891b2';if(t.includes('word'))return '#2563a8';return '#666';};
  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
    {pFiles.map(f=><div key={f.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--ink-25)',borderRadius:'var(--r-md)',border:'1px solid var(--border-subtle)'}}>
      <i className={`fas ${icon(f.type)}`} style={{fontSize:20,color:color(f.type),flexShrink:0}}></i>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
        <div style={{fontSize:'10px',color:'var(--text-muted)',marginTop:2}}>{f.uploadedBy} · {f.size?Math.round(f.size/1024)+'KB ':''}{new Date(f.uploadedAt).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div style={{display:'flex',gap:8,flexShrink:0}}>
        {f.url&&<a href={f.url} target="_blank" rel="noopener" className="btn btn-sm btn-outline"><i className="fas fa-eye"></i></a>}
        {canDelete&&<button className="btn btn-sm btn-danger" onClick={()=>onDelete&&onDelete(f.id)}><i className="fas fa-trash"></i></button>}
      </div>
    </div>)}
  </div>;
}

/* ===== EDIT PATIENT MODAL ===== */
function EditPatientModal({patient,patients,setPatients,onClose}){
  const toast=useToast();
  const [saving,setSaving]=useState(false);
  const [form,setForm]=useState({nom:patient.nom,prenom:patient.prenom,phone:patient.phone,email:patient.email||'',insurance:patient.insurance,sexe:patient.sexe,adresse:patient.adresse||'',langue:patient.langue||'Français',motif:patient.motif||''});
  const save=async()=>{
    if(!form.nom.trim()||!form.prenom.trim()){toast.error('Nom et prénom obligatoires.');return;}
    setSaving(true);
    try{
      const {error}=await supabase.from('patients').update({nom:form.nom.trim(),prenom:form.prenom.trim(),phone:form.phone.trim(),email:form.email.trim(),insurance:form.insurance,sexe:form.sexe,adresse:form.adresse.trim(),langue:form.langue,motif:form.motif.trim()}).eq('id',patient.id);
      if(error)throw error;
      setPatients(patients.map(p=>p.id===patient.id?{...p,...form}:p));
      toast.success('Patient mis à jour');onClose();
    }catch(e){toast.error('Erreur: '+(e.message||''));}
    setSaving(false);
  };
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h2><i className="fas fa-pen-to-square"></i> Modifier: {patient.nom} {patient.prenom}</h2>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        {[['nom','Nom'],['prenom','Prénom'],['phone','Téléphone'],['email','Email'],['adresse','Adresse']].map(([k,l])=><div key={k} className="form-group"><label>{l}</label><input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} />
          </div>)}
        <div className="form-group"><label>Assurance</label>
          <select value={form.insurance} onChange={e=>setForm({...form,insurance:e.target.value})}>
            {INSURANCE_TYPES.map(t=><option key={t} value={t}>{t} — {INSURANCE_INFO[t]?.desc}</option>)}
          </select>
          {form.insurance&&<div style={{fontSize:'11px',color:'var(--text-muted)',marginTop:4}}>{INSURANCE_INFO[form.insurance]?.desc}</div>}
        </div>
        <div className="form-group"><label>Sexe</label><select value={form.sexe} onChange={e=>setForm({...form,sexe:e.target.value})}><option value="M">Masculin</option><option value="F">Féminin</option></select></div>
        <div className="form-group"><label>Langue</label><select value={form.langue} onChange={e=>setForm({...form,langue:e.target.value})}><option>Français</option><option>Lingala</option><option>Kikongo</option><option>Swahili</option><option>Tshiluba</option></select></div>
      </div>
      <div className="form-group"><label>Motif de visite</label><input value={form.motif} onChange={e=>setForm({...form,motif:e.target.value})}/></div>
      <div style={{display:'flex',gap:10,marginTop:18}}>
        <button className={`btn btn-success ${saving?'loading':''}`} onClick={save} disabled={saving}><i className="fas fa-save"></i> Enregistrer</button>
        <button className="btn btn-outline" onClick={onClose} disabled={saving}>Annuler</button>
      </div>
    </div>
  </div>;
}

/* ===== MAIN APP ===== */
function App(){
  const toast=useToast();
  const [user,setUser]=useState(null);
  const [patients,setPatients]=useState([]);
  const [inventory,setInventory]=useState([]);
  const [payments,setPayments]=useState([]);
  const [labOrders,setLabOrders]=useState([]);
  const [confidentialNotes,setConfidentialNotes]=useState([]);
  const [prescriptions,setPrescriptions]=useState([]);
  const [notifications,setNotifications]=useState([]);
  const [files,setFiles]=useState([]);
  const [onlineStaff,setOnlineStaff]=useState([]);
  const [loading,setLoading]=useState(false);
  const [activePortal,setActivePortal]=useState(null);

  const addNotification=useCallback(async notif=>{
    const n={id:'NOTIF'+Date.now(),...notif,createdAt:new Date().toISOString(),read:false};
    try{await supabase.from('notifications').insert({id:n.id,type:n.type,message:n.message,patient_id:n.patientId,patient_name:n.patientName,for_doctor_id:n.forDoctorId,for_doctor_name:n.forDoctorName,from_user:n.fromUser,created_at:n.createdAt,read:false});}catch(e){}
    setNotifications(p=>[n,...p]);
  },[]);

  useEffect(()=>{
    if(!user)return;
    async function load(){
      setLoading(true);
      try{
        const {data:pData}=await supabase.from('patients').select('*').order('registered_at',{ascending:false});
        if(pData){
          const pts=await Promise.all(pData.map(async p=>{
            const {data:vData}=await supabase.from('vitals').select('*').eq('patient_id',p.id).order('recorded_at',{ascending:false}).limit(1);
            const vitals=vData&&vData[0]?{temp:vData[0].temp,tension:vData[0].tension,poids:vData[0].poids,taille:vData[0].taille,pouls:vData[0].pouls,spo2:vData[0].spo2,triage:vData[0].triage}:null;
            return {...p,registeredAt:p.registered_at,registeredBy:p.registered_by,stepLabel:p.step_label,isNew:p.is_new,doctorId:p.doctor_id||null,doctorName:p.doctor_name||null,vitals,hospitalization:p.hospitalization||null};
          }));
          setPatients(pts);
        }
        const {data:payData}=await supabase.from('payments').select('*').order('date',{ascending:false});
        if(payData)setPayments(payData.map(p=>({...p,patientId:p.patient_id,patientName:p.patient_name,processedBy:p.processed_by})));
        const {data:labData}=await supabase.from('lab_orders').select('*').order('date',{ascending:false});
        if(labData)setLabOrders(labData.map(l=>({...l,patientId:l.patient_id,patientName:l.patient_name,orderedBy:l.ordered_by,completedAt:l.completed_at,completedBy:l.completed_by})));
        const {data:rxData}=await supabase.from('prescriptions').select('*').order('date',{ascending:false});
        if(rxData)setPrescriptions(rxData.map(r=>({...r,patientId:r.patient_id,patientName:r.patient_name,prescribedBy:r.prescribed_by,dispensedAt:r.dispensed_at})));
        const {data:noteData}=await supabase.from('confidential_notes').select('*').order('date',{ascending:false});
        if(noteData)setConfidentialNotes(noteData.map(n=>({...n,patientId:n.patient_id,patientName:n.patient_name,doctorId:n.doctor_id,doctorName:n.doctor_name})));
        const {data:invData}=await supabase.from('inventory').select('*').order('name');
        if(invData)setInventory(invData.map(m=>({...m,minStock:m.min_stock,lastRestock:m.last_restock})));
        try{const {data:nData}=await supabase.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);if(nData)setNotifications(nData.map(n=>({...n,patientId:n.patient_id,patientName:n.patient_name,forDoctorId:n.for_doctor_id,forDoctorName:n.for_doctor_name,fromUser:n.from_user,createdAt:n.created_at})));}catch(e){}
        try{const {data:fData}=await supabase.from('patient_files').select('*').order('uploaded_at',{ascending:false});if(fData)setFiles(fData.map(f=>({...f,patientId:f.patient_id,patientName:f.patient_name,uploadedBy:f.uploaded_by,uploadedAt:f.uploaded_at})));}catch(e){}
      }catch(e){console.error(e);toast.error('Erreur chargement données.');}
      setLoading(false);
    }
    load();

    // Real-time
    const mapP=p=>({...p,registeredAt:p.registered_at,registeredBy:p.registered_by,stepLabel:p.step_label,isNew:p.is_new,doctorId:p.doctor_id||null,doctorName:p.doctor_name||null,vitals:null,hospitalization:p.hospitalization||null});
    const ch=supabase.channel('crm-rt')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'patients'},pl=>{const p=mapP(pl.new);setPatients(prev=>prev.some(x=>x.id===p.id)?prev:[p,...prev]);})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'patients'},pl=>{const p=pl.new;setPatients(prev=>prev.map(x=>x.id===p.id?{...x,step:p.step,stepLabel:p.step_label,insurance:p.insurance,diagnosis:p.diagnosis,isNew:p.is_new,doctorId:p.doctor_id||null,doctorName:p.doctor_name||null,nom:p.nom,prenom:p.prenom,phone:p.phone,hospitalization:p.hospitalization||null}:x));})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'payments'},pl=>{const p={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,processedBy:pl.new.processed_by};setPayments(prev=>prev.some(x=>x.id===p.id)?prev:[p,...prev]);})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'lab_orders'},pl=>{const l={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,orderedBy:pl.new.ordered_by,completedAt:pl.new.completed_at,completedBy:pl.new.completed_by};setLabOrders(prev=>prev.some(x=>x.id===l.id)?prev:[l,...prev]);})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'lab_orders'},pl=>{const l={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,orderedBy:pl.new.ordered_by,completedAt:pl.new.completed_at,completedBy:pl.new.completed_by};setLabOrders(prev=>prev.map(x=>x.id===l.id?l:x));})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'prescriptions'},pl=>{const r={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,prescribedBy:pl.new.prescribed_by,dispensedAt:pl.new.dispensed_at};setPrescriptions(prev=>prev.some(x=>x.id===r.id)?prev:[r,...prev]);})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'prescriptions'},pl=>{const r={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,prescribedBy:pl.new.prescribed_by,dispensedAt:pl.new.dispensed_at};setPrescriptions(prev=>prev.map(x=>x.id===r.id?r:x));})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'confidential_notes'},pl=>{const n={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,doctorId:pl.new.doctor_id,doctorName:pl.new.doctor_name};setConfidentialNotes(prev=>prev.some(x=>x.id===n.id)?prev:[...prev,n]);})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},pl=>{const n={...pl.new,patientId:pl.new.patient_id,patientName:pl.new.patient_name,forDoctorId:pl.new.for_doctor_id,forDoctorName:pl.new.for_doctor_name,fromUser:pl.new.from_user,createdAt:pl.new.created_at};setNotifications(prev=>prev.some(x=>x.id===n.id)?prev:[n,...prev]);})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'inventory'},pl=>{const m={...pl.new,minStock:pl.new.min_stock,lastRestock:pl.new.last_restock};setInventory(prev=>prev.map(x=>x.id===m.id?m:x));})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'vitals'},pl=>{const v=pl.new;setPatients(prev=>prev.map(p=>p.id===v.patient_id?{...p,vitals:{temp:v.temp,tension:v.tension,poids:v.poids,taille:v.taille,pouls:v.pouls,spo2:v.spo2,triage:v.triage}}:p));})
      .subscribe();

    // Presence
    const pCh=supabase.channel('online-staff',{config:{presence:{key:user.id}}});
    pCh.on('presence',{event:'sync'},()=>{const st=pCh.presenceState();const ol=[];Object.values(st).forEach(arr=>arr.forEach(p=>{if(p.staffId)ol.push(p.staffId);}));setOnlineStaff([...new Set(ol)]);})
    .subscribe(async status=>{if(status==='SUBSCRIBED')await pCh.track({staffId:user.id,name:user.name,role:user.role,joinedAt:new Date().toISOString()});});

    window.addEventListener('beforeunload',()=>pCh.untrack());
    return()=>{pCh.untrack();supabase.removeChannel(pCh);supabase.removeChannel(ch);};
  },[user]);

  if(!user)return <LoginPage onLogin={u=>{setUser(u);setActivePortal(u.role==='superadmin'?'admin':u.role);}}/>;
  if(loading)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,background:'#f4f5f7'}}>
    <div style={{fontSize:'14px',color:'#1a3c34',fontWeight:600}}>Chargement des données...</div>
    <div style={{width:200,height:4,background:'#e0e4e2',borderRadius:2,overflow:'hidden'}}><div style={{width:'60%',height:'100%',background:'#2e7d5b',borderRadius:2,animation:'loading 1.5s ease-in-out infinite'}}></div></div>
  </div>;

  const isSA=user.role==='superadmin';
  const effectiveRole=isSA?(activePortal||'admin'):user.role;
  const cv=activePortal||user.role;
  const props={user:{...user,role:effectiveRole,isSuperAdmin:isSA},patients,setPatients,inventory,setInventory,payments,setPayments,labOrders,setLabOrders,confidentialNotes,setConfidentialNotes,prescriptions,setPrescriptions,notifications,setNotifications,files,setFiles,addNotification,toast};

  const portal={
    reception:<ReceptionView {...props}/>,
    nurse:<NurseView {...props}/>,
    doctor:<DoctorView {...props}/>,
    lab:<LabView {...props}/>,
    pharmacy:<PharmacyView {...props}/>,
    admin:<AdminView {...props} staff={[...STAFF_DB,...STAFF_NO_LOGIN]} onlineStaff={onlineStaff}/>,
  };

  return <div>
    {isSA&&<div style={{position:'fixed',top:0,left:0,right:0,zIndex:1001,background:'linear-gradient(135deg,#7c3aed,#a855f7)',padding:'6px 20px',display:'flex',alignItems:'center',gap:12,boxShadow:'0 2px 12px rgba(124,58,237,.3)'}}>
      <span style={{color:'#fff',fontSize:'11px',fontWeight:700}}><i className="fas fa-shield-halved"></i> SUPER ADMIN — ACCÈS TOTAL</span>
      <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
        {[{id:'admin',l:'Admin',i:'fa-chart-pie'},{id:'reception',l:'Réception',i:'fa-door-open'},{id:'pharmacy',l:'Pharmacie',i:'fa-pills'},{id:'nurse',l:'Infirmier',i:'fa-heartbeat'},{id:'doctor',l:'Médecin',i:'fa-stethoscope'},{id:'lab',l:'Labo',i:'fa-flask'}].map(p=><button key={p.id} onClick={()=>setActivePortal(p.id)} style={{padding:'4px 12px',borderRadius:6,border:'none',cursor:'pointer',fontSize:'11px',fontWeight:600,background:cv===p.id?'#fff':'rgba(255,255,255,.15)',color:cv===p.id?'#7c3aed':'#fff',display:'flex',alignItems:'center',gap:5}}>
          <i className={`fas ${p.i}`} style={{fontSize:'10px'}}></i>{p.l}
        </button>)}
      </div>
    </div>}
    <div style={isSA?{paddingTop:'38px',height:'100vh'}:{}}>{portal[cv]||portal.admin}</div>
    <AIAssistant user={user}/>
  </div>;
}

function LoginPage({onLogin}){
  const [u,setU]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');const [loading,setLoading]=useState(false);
  const login=e=>{
    e.preventDefault();setLoading(true);setErr('');
    setTimeout(()=>{
      const found=STAFF_DB.find(s=>s.username===u.toLowerCase().trim());
      if(!found){setErr(`Identifiant "${u}" introuvable.`);setLoading(false);return;}
      if(found.password!==p.trim()){setErr('Mot de passe incorrect.');setLoading(false);return;}

    <div className="login-card">

      </div>
      <p style={{fontSize:'12px',color:'var(--text-light)',marginBottom:22,textAlign:'center'}}>Accès réservé au personnel autorisé</p>
      <form onSubmit={login}>
        <div className="form-group"><label><i className="fas fa-user" style={{fontSize:'10px'}}></i> Identifiant</label><input value={u} onChange={e=>setU(e.target.value)} placeholder="Nom d'utilisateur" autoFocus autoComplete="username"/></div>
        <div className="form-group"><label><i className="fas fa-lock" style={{fontSize:'10px'}}></i> Mot de passe</label><input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••••••" autoComplete="current-password"/></div>
        {err&&<div style={{color:'var(--danger-700)',fontSize:'12px',marginBottom:16,padding:'10px 14px',background:'var(--danger-50)',borderRadius:'var(--r-md)',border:'1px solid var(--danger-100)',display:'flex',alignItems:'flex-start',gap:8}}><i className="fas fa-exclamation-circle" style={{marginTop:2}}></i><span>{err}</span></div>}

      </form>
      <div style={{textAlign:'center',marginTop:24,paddingTop:18,borderTop:'1px solid var(--border-subtle)',fontSize:'10.5px',color:'var(--text-muted)',lineHeight:1.8}}>

        <a href="https://www.facebook.com/cliniquethegraceofgod" target="_blank" rel="noopener" style={{color:'var(--primary-500)',fontSize:'10.5px',display:'inline-flex',alignItems:'center',gap:4,marginTop:4}}><i className="fab fa-facebook"></i> Page Facebook</a>
      </div>
    </div>
  </div>;
}

/* ===== RECEPTION VIEW ===== */
function ReceptionView({user,patients,setPatients,payments,labOrders,prescriptions,files,toast}){
  const [tab,setTab]=useState('register');
  const [form,setForm]=useState({nom:'',prenom:'',phone:'',email:'',sexe:'M',dob:'',langue:'Français',adresse:'',motif:'',insurance:'Régulier'});
  const [saving,setSaving]=useState(false);
  const [searchQ,setSearchQ]=useState('');
  const [foundPatient,setFoundPatient]=useState(null);
  const [hospModal,setHospModal]=useState(null);
  const today=patients.filter(p=>new Date(p.registeredAt).toDateString()===new Date().toDateString());

  // Search existing patient
  const searchPatient=()=>{
    if(searchQ.length<2)return;
    const found=patients.filter(p=>`${p.nom} ${p.prenom} ${p.phone} ${p.id}`.toLowerCase().includes(searchQ.toLowerCase()));
    setFoundPatient(found);
  };

  const readmitPatient=async(p)=>{
    try{
      const now=new Date().toISOString();
      const {error}=await supabase.from('patients').update({step:1,step_label:'Pharmacie (Consultation)',registered_at:now,registered_by:user.name,is_new:false}).eq('id',p.id);
      if(error)throw error;
      setPatients(patients.map(x=>x.id===p.id?{...x,step:1,stepLabel:'Pharmacie (Consultation)',registeredAt:now,registeredBy:user.name,isNew:false}:x));
      toast.success(`${p.nom} ${p.prenom} ré-admis aujourd'hui`);
      setFoundPatient(null);setSearchQ('');setTab('list');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
  };

  const registerPatient=async e=>{
    e.preventDefault();
    if(!form.nom.trim()||!form.prenom.trim()||!form.phone.trim()){toast.error('Nom, prénom et téléphone obligatoires.');return;}
    setSaving(true);
    try{
      const newP={id:genId(),nom:form.nom.trim(),prenom:form.prenom.trim(),phone:form.phone.trim(),email:form.email.trim(),sexe:form.sexe,dob:form.dob||null,langue:form.langue,adresse:form.adresse.trim(),motif:form.motif.trim(),insurance:form.insurance,step:1,stepLabel:'Pharmacie (Consultation)',registeredAt:new Date().toISOString(),registeredBy:user.name,vitals:null,isNew:true};
      const {error}=await supabase.from('patients').insert({id:newP.id,nom:newP.nom,prenom:newP.prenom,phone:newP.phone,email:newP.email,sexe:newP.sexe,dob:newP.dob,langue:newP.langue,adresse:newP.adresse,motif:newP.motif,insurance:newP.insurance,step:1,step_label:'Pharmacie (Consultation)',registered_at:newP.registeredAt,registered_by:user.name,is_new:true});
      if(error)throw error;
      setPatients([newP,...patients]);
      setForm({nom:'',prenom:'',phone:'',email:'',sexe:'M',dob:'',langue:'Français',adresse:'',motif:'',insurance:'Régulier'});
      toast.success(`${newP.nom} ${newP.prenom} enregistré → Pharmacie`);
      setTab('list');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
    setSaving(false);
  };

  const requestHosp=async(hospData)=>{
    try{
      const {error}=await supabase.from('patients').update({hospitalization:hospData}).eq('id',hospData.patientId);
      if(error)throw error;
      setPatients(patients.map(p=>p.id===hospData.patientId?{...p,hospitalization:hospData}:p));
      toast.success(`Hospitalisation demandée — Chambre ${hospData.room}`);
      setHospModal(null);
    }catch(e){toast.error('Erreur hospitalisation: '+(e.message||''));}
  };

  const tabs=[
    {id:'register',icon:'fas fa-user-plus',label:'Nouveau Patient'},
    {id:'readmit',icon:'fas fa-rotate-right',label:'Ré-admettre'},
    {id:'list',icon:'fas fa-clipboard-list',label:'Patients du Jour',count:today.length},
    {id:'hosp',icon:'fas fa-bed',label:'Hospitalisations'},
  ];

  const hospitalized=patients.filter(p=>p.hospitalization);

  return <DashLayout user={user} tabs={tabs} activeTab={tab} setActiveTab={setTab}>
    {tab==='register'&&<div>
      <div className="page-header"><div><h1>Enregistrement Patient</h1><p>Nouveau patient — dirigé vers la pharmacie pour le paiement</p></div></div>
      <div className="card">
        <form onSubmit={registerPatient}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div className="form-group"><label>Nom de famille *</label><input required value={form.nom} onChange={e=>setForm({...form,nom:e.target.value})} placeholder="MBALA"/></div>
            <div className="form-group"><label>Prénom *</label><input required value={form.prenom} onChange={e=>setForm({...form,prenom:e.target.value})} placeholder="Jean-Pierre"/></div>
            <div className="form-group"><label>Téléphone *</label><input required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+243 8XX XXX XXX"/></div>
            <div className="form-group"><label>Email</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="optionnel"/></div>
            <div className="form-group"><label>Sexe</label><select value={form.sexe} onChange={e=>setForm({...form,sexe:e.target.value})}><option value="M">Masculin</option><option value="F">Féminin</option></select></div>
            <div className="form-group"><label>Date de naissance</label><input type="date" value={form.dob} onChange={e=>setForm({...form,dob:e.target.value})}/></div>
            <div className="form-group"><label>Langue préférée</label><select value={form.langue} onChange={e=>setForm({...form,langue:e.target.value})}><option>Français</option><option>Lingala</option><option>Kikongo</option><option>Swahili</option><option>Tshiluba</option></select></div>
            <div className="form-group"><label>Adresse / Quartier</label><input value={form.adresse} onChange={e=>setForm({...form,adresse:e.target.value})} placeholder="Quartier, Commune"/></div>
          </div>
          <div className="form-group"><label>Catégorie d'assurance</label>
            <select value={form.insurance} onChange={e=>setForm({...form,insurance:e.target.value})}>
              {INSURANCE_TYPES.map(t=><option key={t} value={t}>{t} — {INSURANCE_INFO[t]?.desc}</option>)}
            </select>
            {form.insurance&&<div style={{fontSize:'11px',color:'var(--text-muted)',marginTop:4,padding:'6px 10px',background:'var(--ink-25)',borderRadius:'var(--r-sm)'}}><i className="fas fa-info-circle" style={{color:'var(--info-500)',marginRight:6}}></i>{INSURANCE_INFO[form.insurance]?.desc}</div>}
          </div>
          <div className="form-group"><label>Motif de visite</label><input value={form.motif} onChange={e=>setForm({...form,motif:e.target.value})} placeholder="Ex: Fièvre, consultation prénatale..."/></div>
          <div style={{display:'flex',gap:12,marginTop:20}}>
            <button className={`btn btn-primary btn-lg ${saving?'loading':''}`} type="submit" disabled={saving}>{saving?<><i className="fas fa-spinner fa-spin"></i> Enregistrement...</>:<><i className="fas fa-check-circle"></i> Enregistrer & Envoyer → Pharmacie</>}</button>
          </div>
        </form>
      </div>
    </div>}

    {tab==='readmit'&&<div>
      <div className="page-header"><div><h1>Ré-admission Patient</h1><p>Retrouver un patient existant et l'ajouter à la journée</p></div></div>
      <div className="card">
        <div style={{display:'flex',gap:10,marginBottom:16}}>

/* ===== HOSPITALIZATION MODAL ===== */
function HospitalizationModal({patient,requestedBy,onConfirm,onClose}){
  const [room,setRoom]=useState('');
  const [reason,setReason]=useState('');
  const save=()=>{
    if(!room.trim()){alert('Numéro de chambre requis');return;}
    onConfirm({patientId:patient.id,patientName:`${patient.nom} ${patient.prenom}`,room:room.trim(),reason:reason.trim(),admittedBy:requestedBy,admittedAt:new Date().toISOString(),status:'active'});
  };
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h2><i className="fas fa-bed" style={{color:'#0891b2'}}></i> Demande d'hospitalisation</h2>
      <div style={{padding:'14px 16px',background:'#e0f2fe',borderRadius:'var(--r-md)',border:'1px solid #0891b2',marginBottom:20}}>
        <div style={{fontWeight:700}}>{patient.nom} {patient.prenom}</div>
        <div style={{fontSize:'12px',color:'#0369a1',marginTop:4}}>{patient.phone} · <InsuranceBadge type={patient.insurance} size="badge-sm"/></div>
      </div>
      <div className="form-group"><label><i className="fas fa-bed"></i> Numéro de chambre *</label><input value={room} onChange={e=>setRoom(e.target.value)} placeholder="Ex: 12, 3A, Maternité-2..."/></div>
      <div className="form-group"><label>Raison / Diagnostic d'admission</label><textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="Raison de l'hospitalisation..." style={{minHeight:80}}/></div>
      <div style={{display:'flex',gap:10,marginTop:18}}>
        <button className="btn btn-info btn-lg" onClick={save}><i className="fas fa-bed"></i> Confirmer l'hospitalisation</button>
        <button className="btn btn-outline" onClick={onClose}>Annuler</button>
      </div>
    </div>
  </div>;
}

/* ===== NURSE VIEW ===== */
function NurseView({user,patients,setPatients,labOrders,payments,prescriptions,files,toast}){
  const [tab,setTab]=useState('queue');
  const [dossier,setDossier]=useState(null);
  const myPatients=patients.filter(p=>p.step===2);
  // After lab: patients who just got results back and need to go to doctor
  const labReturnPatients=patients.filter(p=>p.step===2&&p.fromLab);

  const saveVitals=async(pid,vitals)=>{
    if(!vitals.temp||!vitals.tension){toast.error('Température et tension obligatoires.');return;}
    try{
      const {error}=await supabase.from('vitals').insert({patient_id:pid,temp:vitals.temp,tension:vitals.tension,poids:vitals.poids,taille:vitals.taille,pouls:vitals.pouls,spo2:vitals.spo2,triage:vitals.triage,recorded_by:user.name});
      if(error)throw error;
      await supabase.from('patients').update({step:3,step_label:'Médecin',is_new:false}).eq('id',pid);
      setPatients(patients.map(p=>p.id===pid?{...p,vitals,step:3,stepLabel:'Médecin',isNew:false}:p));
      toast.success('Vitaux enregistrés → Médecin');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
  };

  const sendToDoctor=async(pid)=>{
    try{
      await supabase.from('patients').update({step:3,step_label:'Médecin (Résultats Labo)',from_lab:false}).eq('id',pid);
      setPatients(patients.map(p=>p.id===pid?{...p,step:3,stepLabel:'Médecin (Résultats Labo)',fromLab:false}:p));
      toast.success('Patient envoyé au médecin avec résultats');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
  };

  // Hospitalized nursing acts
  const hospPatients=patients.filter(p=>p.hospitalization&&p.hospitalization.status==='active');

  const tabs=[
    {id:'queue',icon:'fas fa-heartbeat',label:'File Vitaux',count:myPatients.length},
    {id:'hosp_acts',icon:'fas fa-notes-medical',label:'Actes Hospit.',count:hospPatients.length},
    {id:'all',icon:'fas fa-users',label:'Vue Globale'},
  ];

  return <DashLayout user={user} tabs={tabs} activeTab={tab} setActiveTab={setTab}>
    {tab==='queue'&&<div>
      <div className="page-header"><div><h1>Prise des Vitaux</h1><p>{myPatients.length} patient(s) en attente</p></div></div>
      {!myPatients.length&&<div className="card" style={{textAlign:'center',padding:30}}><p style={{color:'var(--text-light)',fontSize:'16px'}}>Aucun patient en attente</p></div>}
      {myPatients.map(p=><NursePatientCard key={p.id} patient={p} onSave={saveVitals} onSendToDoctor={sendToDoctor} onViewDossier={setDossier} labOrders={labOrders}/>)}
    </div>}

    {tab==='hosp_acts'&&<div>
      <div className="page-header"><div><h1>Actes d'Hospitalisation</h1><p>Soins infirmiers pour patients hospitalisés</p></div></div>
      {!hospPatients.length&&<div className="card"><div className="empty-state"><div className="empty-state-icon"><i className="fas fa-bed"></i></div><div className="empty-state-title">Aucun patient hospitalisé</div></div></div>}
      {hospPatients.map(p=><HospActCard key={p.id} patient={p} user={user} payments={payments} setPatients={setPatients} patients={patients} toast={toast}/>)}
    </div>}

    {tab==='all'&&<div>
      <div className="page-header"><div><h1>Vue Globale Patients</h1></div></div>
      <div className="card">
        <table><thead><tr><th>Patient</th><th>Assurance</th><th>Étape</th><th>Triage</th><th>Vitaux</th><th></th></tr></thead>
        <tbody>{patients.map(p=><tr key={p.id}>
          <td><strong>{p.nom} {p.prenom}</strong></td>
          <td><InsuranceBadge type={p.insurance} size="badge-sm"/></td>
          <td><span className={`badge ${p.step===7?'badge-green':'badge-blue'}`}>{p.stepLabel}</span></td>
          <td>{p.vitals?.triage?<span className={`badge badge-sm ${p.vitals.triage.includes('Rouge')?'badge-red':p.vitals.triage.includes('Orange')?'badge-yellow':'badge-green'}`}>{p.vitals.triage.split(' ')[0]}</span>:'—'}</td>
          <td style={{fontSize:'11px'}}>{p.vitals?`${p.vitals.temp}°C | TA:${p.vitals.tension}`:'—'}</td>
          <td><button className="btn btn-sm btn-primary" onClick={()=>setDossier(p)}><i className="fas fa-folder-open"></i></button></td>
        </tr>)}</tbody>
        </table>
      </div>
    </div>}

    {dossier&&<PatientDossier patient={dossier} payments={payments} labOrders={labOrders} prescriptions={prescriptions} confidentialNotes={[]} files={files} user={user} patients={patients} setPatients={setPatients} onClose={()=>setDossier(null)}/>}
  </DashLayout>;
}

/* ===== HOSPITALIZATION ACT CARD ===== */
function HospActCard({patient,user,payments,setPatients,patients,toast}){
  const [act,setAct]=useState('');
  const [price,setPrice]=useState('');
  const [saving,setSaving]=useState(false);

  const saveAct=async()=>{
    if(!act.trim()){toast.warning('Décrivez l\'acte infirmier.');return;}
    setSaving(true);
    try{
      // Record nursing act in hospitalization
      const existingActs=patient.hospitalization.acts||[];
      const newAct={id:'ACT'+Date.now(),description:act,price:parseInt(price)||0,date:new Date().toISOString(),by:user.name,paid:false};
      const updatedHosp={...patient.hospitalization,acts:[...existingActs,newAct]};
      const {error}=await supabase.from('patients').update({hospitalization:updatedHosp}).eq('id',patient.id);
      if(error)throw error;
      setPatients(patients.map(p=>p.id===patient.id?{...p,hospitalization:updatedHosp}:p));
      setAct('');setPrice('');
      toast.success('Acte infirmier enregistré');
    }catch(e){toast.error('Erreur: '+(e.message||''));}
    setSaving(false);
  };

  const acts=patient.hospitalization?.acts||[];
  const totalActs=acts.reduce((s,a)=>s+a.price,0);
  return <div className="hosp-card" style={{marginBottom:12,padding:'16px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
      <div>
        <div style={{fontWeight:700,fontSize:'14px',display:'flex',alignItems:'center',gap:8}}><PatientAvatar patient={patient} size="sm"/> {patient.nom} {patient.prenom}</div>
        <div style={{fontSize:'12px',color:'#0369a1',marginTop:4}}><i className="fas fa-bed"></i> Chambre {patient.hospitalization.room} · {patient.phone}</div>
        <div style={{marginTop:6}}><InsuranceBadge type={patient.insurance} size="badge-sm"/></div>
      </div>
      <div style={{fontSize:'12px',color:'var(--text-muted)',textAlign:'right'}}>
        {acts.length} acte(s) · Total: <strong style={{color:'var(--primary)'}}>{fmt(totalActs)}</strong>
      </div>
    </div>
    {acts.length>0&&<div style={{marginTop:10,background:'rgba(255,255,255,.5)',borderRadius:'var(--r-sm)',padding:'8px 12px'}}>
      {acts.map(a=><div key={a.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12px',padding:'3px 0',borderBottom:'1px dashed rgba(0,0,0,.1)'}}>
        <span>{a.description} <span style={{color:'var(--text-muted)'}}>— {a.by}</span></span>
        <span style={{fontWeight:600}}>{a.price>0?fmt(a.price):'—'} {a.paid?<span style={{color:'green'}}> ✓</span>:''}</span>
      </div>)}
    </div>}
    <div style={{marginTop:12,display:'flex',gap:8}}>
      <input style={{flex:2,padding:'8px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-md)',fontSize:'13px'}} value={act} onChange={e=>setAct(e.target.value)} placeholder="Acte infirmier (pansement, injection, perfusion...)"/>
      <input style={{width:130,padding:'8px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-md)',fontSize:'13px'}} type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="Prix CDF"/>
      <button className={`btn btn-success btn-sm ${saving?'loading':''}`} onClick={saveAct} disabled={saving}><i className="fas fa-plus"></i> Ajouter</button>
    </div>
  </div>;
}
